<style>

.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.col{display:flex;flex-direction:column;gap:12px}

.btn.line{background:var(--surface);color:var(--text);border:1px solid var(--line2);box-shadow:none}.btn.line:hover{background:var(--surface2);filter:none}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.ghost{background:transparent;color:var(--brand);box-shadow:none}.btn.ghost:hover{background:var(--tint);filter:none}.btn.dl{color:var(--bad)}.btn.warn{background:var(--warn)}

<body>
<div id="root"></div>
<script>
/* ===================== Smart Safe Ride — Admin Panel =====================
   Reads and writes the same browser storage as the passenger / driver app
   (key "ssr_pax_v1"), so every admin action shows up in open app tabs live.
   Admin-only data (team, roles, settings, activity log) lives in "ssr_admin_v1". */
const KEY='ssr_pax_v1',SESS='ssr_admin_sess2',AKEY='ssr_admin_v1',LASTK='ssr_admin_last';
let ADM={},DEFHASH='';

/* ========================= PERMISSIONS & ROLES ========================= */
/* [key, group, plain-language name, what it allows] */
const PERMS=[
 ['dash.view','Overview','See the dashboard','Numbers, charts and alerts on the first page'],
 ['map.view','Overview','See the live map','Where drivers, trips and SOS alerts are right now'],
 ['pax.view','Passengers','See passengers','Open the passenger list and each profile'],
 ['pax.create','Passengers','Add passengers','Create a new passenger account from the panel'],
 ['pax.edit','Passengers','Edit passengers','Change name, email or gender, send a message, add private notes'],
 ['pax.money','Passengers','Change passenger wallets','Add money to or take money from a wallet'],
 ['pax.block','Passengers','Suspend passengers','Block or unblock a passenger account'],
 ['pax.delete','Passengers','Delete passengers','Remove a passenger account for good'],
 ['drv.view','Drivers','See drivers','Open the driver list, documents and earnings'],
 ['drv.approve','Drivers','Approve or reject drivers','Decide on new driver applications'],
 ['drv.create','Drivers','Add drivers','Create a driver account (and approve it) from the panel'],
 ['drv.edit','Drivers','Edit drivers','Change details and expiry dates, send a message, force offline, add notes'],
 ['drv.money','Drivers','Change driver balances','Add money to or take money from a driver balance'],
 ['drv.block','Drivers','Suspend drivers','Block or unblock a driver account'],
 ['drv.delete','Drivers','Delete drivers','Remove a driver account for good'],
 ['ride.view','Rides','See rides & bookings','Open every booking and its details'],
 ['ride.manage','Rides','Cancel and refund bookings','Cancel a booking or give money back to the wallet'],
 ['svc.view','Services','See services','Shared routes, luxury listings and monthly requests'],
 ['svc.manage','Services','Manage services','Turn routes and listings on or off, close monthly requests'],
 ['plan.manage','Services','Manage monthly plans','Create, edit and switch off plans; give, extend or cancel a passenger’s plan'],
 ['lux.manage','Services','Manage luxury fleet & rentals','Add, edit and remove our luxury cars; confirm, start, finish or decline rentals'],
 ['comm.view','Communities','See community groups','Read group members and messages'],
 ['comm.manage','Communities','Moderate communities','Hide messages and delete groups'],
 ['comm.create','Communities','Create & approve communities','Make new groups, approve or reject groups made by users, post announcements'],
 ['pay.view','Money','See payments','All top-ups, payments, cash-outs and commission'],
 ['pay.manage','Money','Handle payouts & payments','Pay or reject driver cash-outs, add manual payments, collect dues, change payment rules'],
 ['promo.view','Money','See promo codes','The list of discount codes'],
 ['promo.manage','Money','Manage promo codes','Create, edit, switch off and delete codes'],
 ['safe.view','Safety','See safety','SOS alerts, Women Route checks and safety reports'],
 ['safe.manage','Safety','Handle safety','Dispatch help, close SOS, approve Women Route checks'],
 ['sup.view','Support','See support','Support chats and tickets'],
 ['sup.reply','Support','Answer support','Reply to chats, close chats, resolve tickets'],
 ['note.send','Messages','Send notifications','Send messages to users and show a home screen banner'],
 ['export','Reports','Download lists','Download passengers, drivers, rides and payments as Excel (CSV) files'],
 ['set.view','Settings','See settings','Look at prices, rules and services'],
 ['set.edit','Settings','Change settings','Change prices, rules, services and security options'],
 ['data.backup','Settings','Download backups','Save a copy of all app data'],
 ['data.restore','Settings','Restore backups','Replace app data with a saved copy'],
 ['data.wipe','Settings','Delete all data','Erase every passenger, driver and booking'],
 ['team.manage','Team','Manage admins & roles','Add admins, switch them off, change roles and permissions'],
 ['audit.view','Team','See the activity log','See what every admin did and when'],
];
const ALLP=PERMS.map(p=>p[0]);
const PGROUPS=[...new Set(PERMS.map(p=>p[1]))];
const ROLE_DEFAULTS={
 super:{name:'Super Admin',desc:'Full control of everything, including the team. This role cannot be changed.',perms:ALLP,locked:1},
 admin:{name:'Admin',desc:'Runs the app day to day. Cannot manage the team, restore backups or delete all data.',perms:ALLP.filter(p=>!['team.manage','data.wipe','data.restore'].includes(p))},
 ops:{name:'Operations Manager',desc:'Looks after drivers, rides and services.',perms:['pax.create','drv.create','plan.manage','lux.manage','comm.create','dash.view','map.view','pax.view','pax.edit','drv.view','drv.approve','drv.edit','drv.block','ride.view','ride.manage','svc.view','svc.manage','comm.view','safe.view','sup.view','sup.reply','note.send','export']},
 support:{name:'Support Agent',desc:'Answers chats and tickets and helps users with their bookings.',perms:['dash.view','pax.view','pax.edit','drv.view','ride.view','sup.view','sup.reply','safe.view','comm.view']},
 finance:{name:'Finance',desc:'Handles money: wallets, refunds, payments and promo codes.',perms:['pay.manage','plan.manage','dash.view','pax.view','pax.money','drv.view','drv.money','ride.view','ride.manage','pay.view','promo.view','promo.manage','export','set.view']},
 safety:{name:'Safety Officer',desc:'Handles SOS alerts, Women Route checks and safety reports.',perms:['comm.create','dash.view','map.view','pax.view','pax.block','drv.view','drv.block','ride.view','safe.view','safe.manage','sup.view','sup.reply','comm.view','comm.manage']},
 viewer:{name:'Viewer (read only)',desc:'Can look at everything but cannot change anything.',perms:ALLP.filter(p=>p.endsWith('.view'))},
};
const NEWP3={ops:['pax.create','drv.create','plan.manage','lux.manage','comm.create'],finance:['pay.manage','plan.manage'],safety:['comm.create']};
function ensureRoles(){ADM.roles=ADM.roles||{};if(ADM.permVer!==3){for(const k in ROLE_DEFAULTS){const r=ADM.roles[k];if(!r)continue;const add=k==='admin'?['pax.create','drv.create','plan.manage','lux.manage','comm.create','pay.manage']:k==='viewer'?[]:(NEWP3[k]||[]);add.forEach(p=>{if(!r.perms.includes(p))r.perms.push(p)})}ADM.permVer=3}for(const k in ROLE_DEFAULTS){if(!ADM.roles[k])ADM.roles[k]={id:k,builtin:1,name:ROLE_DEFAULTS[k].name,desc:ROLE_DEFAULTS[k].desc,perms:[...ROLE_DEFAULTS[k].perms]}}const s=ADM.roles.super;s.perms=[...ALLP];s.locked=1;s.builtin=1;s.name='Super Admin'}
const CATS={auth:'Sign-in',pax:'Passengers',drv:'Drivers',ride:'Rides',svc:'Services',comm:'Communities',money:'Money',promo:'Promotions',safety:'Safety',support:'Support',msg:'Messages',settings:'Settings',team:'Team',data:'Data'};
function guessCat(t){t=String(t||'');return /sign/i.test(t)?'auth':/driver/i.test(t)?'drv':/promo/i.test(t)?'promo':/wallet|balance/i.test(t)?'money':/SOS|Women/i.test(t)?'safety':/ticket|support/i.test(t)?'support':/broadcast|banner|notif/i.test(t)?'msg':/route|luxury|listing/i.test(t)?'svc':/community|group|message/i.test(t)?'comm':/booking/i.test(t)?'ride':/backup|data/i.test(t)?'data':/suspend|reactivat|deleted account/i.test(t)?'pax':'settings'}

function loadAdm(){try{ADM=JSON.parse(localStorage.getItem(AKEY)||'null')||{}}catch(e){ADM={}}
  ADM.settings=ADM.settings||{};ADM.patches=ADM.patches||[];ADM.admins=ADM.admins||[];ADM.log=ADM.log||[];ADM.broadcasts=ADM.broadcasts||[];ADM.notes=ADM.notes||{};ADM.lock=ADM.lock||{};ADM.assign=ADM.assign||{};
  /* one-time move from the old single-admin format */
  if(ADM.admin){const o=ADM.admin;if(o.hash&&!ADM.admins.length)ADM.admins.push({id:'A'+uid(),name:o.name||'Super Admin',email:o.email||'admin@smartsaferide.pk',hash:o.hash,role:'super',status:'active',created:Date.now()});
    if((o.log||[]).length&&!ADM.log.length)ADM.log=o.log.map(l=>({id:uid(),ts:l.ts,by:l.by,name:'Super Admin',role:'Super Admin',cat:guessCat(l.text),text:l.text}));
    if((o.broadcasts||[]).length&&!ADM.broadcasts.length)ADM.broadcasts=o.broadcasts;delete ADM.admin}
  ensureRoles();return ADM}
function saveAdm(){localStorage.setItem(AKEY,JSON.stringify(ADM))}

/* ---- admin patches: every admin change is also stored in its own key and re-applied by the app, so a stale write can never erase it ---- */
function admGetPath(o,path){return path.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function admSetPath(o,path,v){const ks=path.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null||typeof a[ks[i]]!=='object')a[ks[i]]={};a=a[ks[i]]}a[ks[ks.length-1]]=v}
function applyPatch(DB,p){const u=p.user?DB.users[p.user]:null;if(p.user&&!u)return false;
  if(u){u.admApplied=u.admApplied||[];if(u.admApplied.includes(p.id))return false}
  let done=false;
  for(const op of p.ops||[]){
    if(op.t==='mk'||op.t==='mkPut'){const M=DB.market=DB.market||{};const col=M[op.col]=M[op.col]||{};const e=col[op.key];if(!e&&op.t!=='mkPut')continue;if(e&&(e.upd||0)>=p.ts)continue;col[op.key]=Object.assign(e||{},op.v,{upd:p.ts});done=true;continue}
    if(op.t==='newUser'){if(!DB.users[op.v.id]&&!Object.values(DB.users).some(x=>x.phone===op.v.phone&&(x.mode==='driver')===(op.v.mode==='driver'))){DB.users[op.v.id]=JSON.parse(JSON.stringify(op.v));done=true}continue}
    if(op.t==='gmsg'){DB.gchat=DB.gchat||{};const g=DB.gchat[op.key]=DB.gchat[op.key]||[];if(!g.some(m=>m.id===op.msg.id)){g.push(op.msg);g.sort((a,b)=>a.ts-b.ts)}done=true;continue}

    if(!u)continue;

/* grid point → real lat/lng (inverse-distance weighting over the known places) */
function grid2ll(p){if(!p)return null;if(p.lat!=null&&p.lng!=null)return[p.lat,p.lng];if(p.x==null)return null;let sw=0,la=0,lo=0;for(const k in PL){const [x,y]=PL[k],d2=(p.x-x)**2+(p.y-y)**2;if(d2<1e-6)return REAL_LL[k];const w=1/(d2*d2);sw+=w;la+=w*REAL_LL[k][0];lo+=w*REAL_LL[k][1]}return[la/sw,lo/sw]}

   <div class="row wrap" style="gap:10px"><label class="fld grow">Show to<select class="inp" id="bna"><option value="all" ${b.aud==='all'||!b.aud?'selected':''}>Everyone</option><option value="passengers" ${b.aud==='passengers'?'selected':''}>Passengers</option><option value="drivers" ${b.aud==='drivers'?'selected':''}>Drivers</option></select></label><label class="fld grow">Colour<select class="inp" id="bnk"><option value="info" ${!b.kind||b.kind==='info'?'selected':''}>Purple — information</option><option value="warn" ${b.kind==='warn'?'selected':''}>Yellow — warning</option><option value="ok" ${b.kind==='ok'?'selected':''}>Green — good news</option></select></label></div>
   <div class="row wrap" style="gap:10px"><label class="fld grow">Start showing on (optional)<input class="inp" id="bnf" type="date" value="${esc(b.from||'')}"></label><label class="fld grow">Stop showing after (optional)<input class="inp" id="bnu" type="date" value="${esc(b.until||'')}"></label></div>
   <div class="preview" id="bnprev"></div>
   <div class="row" style="gap:8px"><button class="btn" type="submit">Publish banner</button>${b.text?'<button class="btn line" type="button" data-act="bannerOff">Remove banner</button>':''}${live?'<span class="badge ok">Live in the app</span>':b.text?'<span class="badge">Not showing now</span>':''}</div></form></div></div>
  <div class="card mt16"><h3>Sent notifications</h3>${hist.length?`<div class="tblwrap" style="border:0"><table class="tbl"><thead><tr><th>When</th><th>Sent by</th><th>To</th><th>Title</th><th>Message</th><th>People</th></tr></thead><tbody>${hist.slice(0,100).map(h=>`<tr><td class="small">${fmtDT(h.ts)}</td><td class="small">${esc(h.byName||'—')}</td><td>${esc((AUD.find(a=>a[0]===h.aud)||[0,h.aud])[1])}</td><td class="b">${esc(h.title)}</td><td class="small">${esc(h.msg)}</td><td>${h.n}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nothing sent yet</div>'}</div>`};
function bannerPreview(){const el=$('#bnprev');if(!el)return;const t=($('#bnt')||{}).value||'',x=($('#bnx')||{}).value||'',k=($('#bnk')||{}).value||'info';const c=k==='warn'?'warn':k==='ok'?'ok':'brand';el.innerHTML=x?`<div class="tiny muted b" style="margin-bottom:6px">PREVIEW</div><div style="display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--${c==='brand'?'tint':c+'-bg'});color:var(--${c})">${ic('bell')}<div><b>${esc(t||'Announcement')}</b><div class="tiny">${esc(x)}</div></div></div>`:'<div class="tiny muted">Type some text to see how the banner will look.</div>'}
function updAudience(){const el=$('#bcount');if(!el)return;const aud=$('#baud').value,n=audienceIds(aud,($('#bph')||{}).value).length;el.innerHTML=`${ic('users')}<div>${aud==='one'?(n?'Found this person.':'Type a phone number of a registered user.'):`This will reach <b>${n}</b> ${n===1?'person':'people'}.`}</div>`}

/* ========================= SETTINGS ========================= */
const swl=(id,title,help,on,dis)=>`<label class="swl"><span><span class="b" style="display:block">${title}</span><span class="hint">${help}</span></span><input type="checkbox" id="${id}" ${on?'checked':''} ${dis?'disabled':''}><span class="sw"></span></label>`;
PAGES.settings=()=>{const s=S(),fm=s.fareMult||{},ed=can('set.edit'),tab=UI.stab,sg=s.surge||{},mt=s.maint||{},off=s.svcOff||[];
  const tabs=[['rules','Business rules'],['prices','Prices'],['services','Services'],['security','Security'],['data','Backup & data']];
  let body='';
  if(tab==='rules')body=`<div class="grid g2"><div class="card"><h3>Money rules</h3><form id="rulesf" class="col"><fieldset ${ed?'':'disabled'} class="col">
   <label class="fld">Commission the app keeps from each driver ride (%)<input class="inp" id="s_comm" type="number" min="0" max="40" step="0.5" value="${s.commission!=null?s.commission:10}"><span class="fhelp">Example: 10 means the app keeps Rs 10 from a Rs 100 ride.</span></label>
   <label class="fld">Lowest driver balance to go online (Rs)<input class="inp" id="s_min" type="number" min="0" step="50" value="${minBal()}"><span class="fhelp">Drivers with less than this must top up before they can take rides.</span></label>
   <label class="fld">Cancellation fee after the driver arrives (Rs)<input class="inp" id="s_fee" type="number" min="0" step="10" value="${s.cancelFee!=null?s.cancelFee:100}"><span class="fhelp">Charged to the passenger if they cancel after the driver has reached them.</span></label>
   <label class="fld">Booking fee on each ride (Rs)<input class="inp" id="s_bfee" type="number" min="0" max="500" step="5" value="${s.bookingFee!=null?s.bookingFee:15}"><span class="fhelp">A small fixed fee added to every standard ride. This is app income.</span></label>
   ${swl('s_auto','Approve drivers automatically','On: drivers who pass the document checks start driving straight away. Off: they wait for you in Drivers → Waiting for you.',s.autoApprove!==false,!ed)}
   ${ed?'<button class="btn" type="submit">Save rules</button>':''}</fieldset></form>${lockedNote('set.edit')}</div>
   <div class="card"><h3>What these rules mean</h3><div class="kv"><span>A Rs 500 ride</span><span>Driver gets <b>${money(500*(1-(s.commission!=null?s.commission:10)/100))}</b>, app keeps <b>${money(500*(s.commission!=null?s.commission:10)/100)}</b></span></div><div class="kv"><span>Driver balance below ${money(minBal())}</span><span>Cannot go online</span></div><div class="kv"><span>Passenger cancels late</span><span>Pays ${money(s.cancelFee!=null?s.cancelFee:100)}</span></div><div class="kv"><span>New driver passes checks</span><span>${s.autoApprove!==false?'Approved automatically':'Waits for an admin'}</span></div></div></div>`;
  if(tab==='prices'){const ex=k=>{const [,b,km,mn]=VEH[k];return Math.round(Math.max(mn,b+km*10)*((fm[k]||1)))};
   body=`<div class="grid g2"><div class="card"><h3>Price per vehicle type</h3><div class="sub">1.00 = normal price. 1.20 = 20% more. 0.90 = 10% less. Only new bookings use the new price.</div><form id="faref" class="col"><fieldset ${ed?'':'disabled'} class="col">${Object.entries(VEH).map(([k,[l]])=>`<label class="fld">${l} <span class="fhelp">— a 10 km ride costs about ${money(ex(k))} (before booking fee and rush hour)</span><input class="inp" id="fm_${k}" type="number" min="0.5" max="3" step="0.05" value="${(fm[k]||1).toFixed(2)}"></label>`).join('')}${ed?'<button class="btn" type="submit">Save prices</button>':''}</fieldset></form>${lockedNote('set.edit')}</div>
   <div class="card"><h3>Rush-hour pricing</h3><div class="sub">Rides cost a little more when demand is high. Rush hours: 8–10 am and 5–8 pm. Late night: 12–5 am.</div><form id="surgef" class="col"><fieldset ${ed?'':'disabled'} class="col">${swl('sg_on','Use rush-hour pricing','Off: the same price all day.',sg.on!==false,!ed)}
    <label class="fld">Rush-hour multiplier<input class="inp" id="sg_peak" type="number" min="1" max="3" step="0.05" value="${(+sg.peak||1.2).toFixed(2)}"><span class="fhelp">1.20 = rides cost 20% more during rush hours.</span></label>
    <label class="fld">Late-night multiplier<input class="inp" id="sg_night" type="number" min="1" max="3" step="0.05" value="${(+sg.night||1.15).toFixed(2)}"></label>${ed?'<button class="btn" type="submit">Save rush-hour pricing</button>':''}</fieldset></form></div></div>`}
  if(tab==='services')body=`<div class="grid g2"><div class="card"><h3>Services on / off</h3><div class="sub">Switch a service off to stop new bookings for it. People see it as “Paused” in the app. Trips already booked are not affected.</div><form id="svcf"><fieldset ${ed?'':'disabled'}>${SERVICES.map(([k,l])=>swl('sv_'+k,l,off.includes(k)?'Paused — passengers cannot book it':'Open for bookings',!off.includes(k),!ed)).join('')}${ed?'<button class="btn mt12" type="submit">Save services</button>':''}</fieldset></form>${lockedNote('set.edit')}</div>
   <div class="card"><h3>Maintenance mode</h3><div class="sub">Stops all new bookings in the app and shows your message on the home screen. Use it during updates or emergencies.</div><form id="maintf" class="col"><fieldset ${ed?'':'disabled'} class="col">${swl('mt_on','Maintenance mode',mt.on?'ON — nobody can book right now':'Off — the app works normally',!!mt.on,!ed)}
    <label class="fld">Title shown in the app<input class="inp" id="mt_t" maxlength="50" value="${esc(mt.title||'')}" placeholder="Bookings are paused"></label><label class="fld">Message shown in the app<textarea class="inp" id="mt_m" rows="3" maxlength="200" placeholder="We are doing a quick update. Please try again in 30 minutes.">${esc(mt.msg||'')}</textarea></label>${ed?'<button class="btn" type="submit">Save maintenance mode</button>':''}</fieldset></form></div></div>`;
  if(tab==='security')body=`<div class="grid g2"><div class="card"><h3>Sign-in safety</h3><form id="secf" class="col"><fieldset ${ed&&can('team.manage')?'':'disabled'} class="col">
   <label class="fld">Sign admins out after no activity for<select class="inp" id="se_sess">${[[15,'15 minutes'],[30,'30 minutes'],[60,'1 hour'],[120,'2 hours'],[480,'8 hours'],[0,'Never (not safe)']].map(([v,l])=>`<option value="${v}" ${(s.sessionMin!=null?+s.sessionMin:30)===v?'selected':''}>${l}</option>`).join('')}</select></label>
   <label class="fld">Lock sign-in after this many wrong passwords<select class="inp" id="se_tries">${[3,5,10].map(v=>`<option ${(s.maxTries||5)===v?'selected':''}>${v}</option>`).join('')}</select></label>
   <label class="fld">Keep it locked for<select class="inp" id="se_lock">${[[5,'5 minutes'],[15,'15 minutes'],[60,'1 hour']].map(([v,l])=>`<option value="${v}" ${(s.lockMin||15)===v?'selected':''}>${l}</option>`).join('')}</select></label>
   ${ed&&can('team.manage')?'<button class="btn" type="submit">Save security</button>':'<div class="hint">Only admins who can manage the team can change these.</div>'}</fieldset></form></div>
   <div class="card"><h3>Good to know</h3><div class="col small"><div>• Every admin has their own email and password. Do not share accounts — the activity log shows who did what.</div><div>• New admins must choose their own password the first time they sign in.</div><div>• If an admin leaves, switch their account off in <b>Admins & roles</b>. They are signed out at once.</div><div>• Passwords must have at least 8 characters, with letters and numbers.</div></div></div></div>`;
  if(tab==='data')body=`<div class="grid g2"><div class="card"><h3>Backups</h3><div class="sub">All app data is saved in this browser. Download a backup before big changes.</div><div class="col">${can('data.backup')?`<button class="btn line" data-act="backup">${ic('down')}Download full backup</button>`:''}${can('data.restore')?`<label class="btn line" style="cursor:pointer">${ic('up')}Restore from a backup file<input type="file" id="restore" accept="application/json" hidden></label>`:''}${!can('data.backup')&&!can('data.restore')?'<div class="hint">Your role cannot download or restore backups.</div>':''}</div></div>
   <div class="card" style="border-color:var(--bad)"><h3 style="color:var(--bad)">${ic('alert')} Danger zone</h3><div class="sub">Deleting all data removes every passenger, driver, booking and message. Admin accounts and settings stay. This cannot be undone.</div>${can('data.wipe')?'<button class="btn bad" data-act="wipe">Delete ALL app data</button>':'<div class="hint">Only a Super Admin can do this.</div>'}</div></div>`;
  return `<div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${tab===k?'on':''}" data-act="stab" data-k="${k}">${l}</button>`).join('')}</div>${body}`};

/* ========================= TEAM: ADMINS & ROLES ========================= */
const canTouch=a=>{const m=me();if(!m||a.id===m.id)return false;if(a.role==='super'&&m.role!=='super')return false;return true};
const assignable=()=>Object.values(ADM.roles).filter(r=>r.id!=='super'||me().role==='super');
PAGES.team=()=>{const tab=UI.ttab,m=me();
  const tabs=`<div class="tabs"><button class="tab ${tab==='admins'?'on':''}" data-act="ttab" data-k="admins">Admins (${ADM.admins.length})</button><button class="tab ${tab==='roles'?'on':''}" data-act="ttab" data-k="roles">Roles & permissions (${Object.keys(ADM.roles).length})</button></div>`;
  if(tab==='admins'){const list=ADM.admins.filter(a=>match(a.name,a.email,roleName(a.role)));
   return tabs+toolbar('Search name, email or role',null,`<button class="btn" data-act="adminNew">${ic('plus')}Add admin</button>`)+
   `<div class="tblwrap"><table class="tbl"><thead><tr><th>Admin</th><th>Role</th><th>Status</th><th>Last sign-in</th><th>Added</th><th></th></tr></thead><tbody>${list.map(a=>`<tr><td><div class="row"><span class="av">${esc(initials(a.name))}</span><div><div class="b">${esc(a.name)}${a.id===m.id?' <span class="badge brand">You</span>':''}</div><div class="tiny muted">${esc(a.email)}</div></div></div></td><td><span class="badge ${a.role==='super'?'brand':'info'}">${esc(roleName(a.role))}</span></td><td>${a.status==='active'?'<span class="badge ok">Active</span>':'<span class="badge bad">Switched off</span>'}${a.mustChange?' <span class="badge warn">Must set password</span>':''}</td><td class="small">${a.lastLogin?fmtDT(a.lastLogin):'Never'}</td><td class="small">${fmtD(a.created)}</td><td>${canTouch(a)?`<div class="row" style="gap:6px;justify-content:flex-end"><button class="btn line sm" data-act="adminEdit" data-id="${a.id}">${ic('edit')}Edit</button><button class="btn line sm" data-act="adminReset" data-id="${a.id}">${ic('key')}New password</button><button class="btn line sm" data-act="adminToggle" data-id="${a.id}">${a.status==='active'?'Switch off':'Switch on'}</button><button class="btn line sm dl" data-act="adminDel" data-id="${a.id}">Delete</button></div>`:a.id===m.id?'<button class="btn ghost sm" data-act="go" data-p="account">My account</button>':'<span class="tiny muted">Only a Super Admin can change this</span>'}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">No admin matches</div></td></tr>'}</tbody></table></div>
   <div class="callout mt12">${ic('shield')}<div class="small">There must always be at least one active Super Admin. You cannot switch off or delete yourself — ask another Super Admin.</div></div>`}
  const R=Object.values(ADM.roles),sel=ADM.roles[UI.role]||ADM.roles.super;UI.role=sel.id;const used=r=>ADM.admins.filter(a=>a.role===r).length;
  const lockedR=sel.locked||(sel.id==='super');
  return tabs+`<div class="split"><div><div class="row between" style="margin-bottom:10px"><b>Roles</b><button class="btn sm" data-act="roleNew">${ic('plus')}New role</button></div>${R.map(r=>`<button class="rolecard ${r.id===sel.id?'on':''}" data-act="rolePick" data-id="${r.id}"><div class="row between"><b>${esc(r.name)}</b><span class="tiny muted">${used(r.id)} admin${used(r.id)===1?'':'s'}</span></div><div class="tiny muted mt8">${esc(r.desc||'')}</div><div class="tiny mt8">${r.id==='super'?'Everything':r.perms.length+' of '+ALLP.length+' permissions'}${r.builtin?' · ready-made':' · custom'}</div></button>`).join('')}</div>
   <div class="card"><div class="row between wrap"><div><h3 style="margin:0">${esc(sel.name)}</h3><div class="small muted">${esc(sel.desc||'')}</div></div><div class="row" style="gap:6px">${!lockedR?`<button class="btn line sm" data-act="roleRename" data-id="${sel.id}">${ic('edit')}Rename</button>`:''}<button class="btn line sm" data-act="roleCopy" data-id="${sel.id}">${ic('copy')}Copy</button>${!sel.builtin?`<button class="btn line sm dl" data-act="roleDel" data-id="${sel.id}">Delete</button>`:''}</div></div>
    ${lockedR?`<div class="callout mt12">${ic('lock')}<div class="small">The Super Admin can do everything. This role cannot be changed.</div></div>`:`<div class="hint mt12">Tick what people with this role are allowed to do, then press Save. Changes work straight away, even for admins who are signed in.${me().role!=='super'?' You can only give permissions that you have yourself.':''}</div>`}
    <form id="rolef" data-id="${sel.id}" class="mt12">${PGROUPS.map(g=>{const ps=PERMS.filter(p=>p[1]===g);return `<div class="perm-g"><div class="ph"><span>${esc(g)}</span>${!lockedR?`<span class="row" style="gap:4px"><button type="button" class="btn ghost sm" data-act="permAll" data-g="${esc(g)}" data-v="1">All</button><button type="button" class="btn ghost sm" data-act="permAll" data-g="${esc(g)}" data-v="0">None</button></span>`:''}</div>${ps.map(([k,,l,h])=>`<label class="perm"><input type="checkbox" name="perm" value="${k}" data-g="${esc(g)}" ${sel.id==='super'||sel.perms.includes(k)?'checked':''} ${lockedR||!can(k)?'disabled':''}><span><b class="small">${esc(l)}</b><span class="tiny muted" style="display:block">${esc(h)}</span></span></label>`).join('')}</div>`}).join('')}
    ${!lockedR?'<button class="btn" type="submit">Save permissions</button>':''}</form></div></div>`};

/* ========================= MY ACCOUNT ========================= */
PAGES.account=()=>{const a=me(),mine=(ADM.log||[]).filter(l=>l.by===a.email).slice(0,15);
  return `<div class="grid g2"><div class="card"><h3>${ic('user')} My details</h3><form id="mef" class="col"><label class="fld">Name<input class="inp" id="me_n" value="${esc(a.name)}" maxlength="50" required></label><label class="fld">Email (used to sign in)<input class="inp" id="me_e" type="email" value="${esc(a.email)}" required></label><label class="fld">Role<input class="inp" value="${esc(roleName(a.role))}" readonly></label><button class="btn" type="submit">Save details</button></form></div>
   <div class="card"><h3>${ic('key')} Change password</h3><form id="mepwf" class="col"><label class="fld">Current password<input class="inp" id="mp_cur" type="password" autocomplete="current-password"></label>${pwField('mp_new','New password')}<label class="fld">Type the new password again<input class="inp" id="mp_rep" type="password" autocomplete="new-password"></label><button class="btn" type="submit">Change password</button></form></div></div>
  <div class="grid g2 mt16"><div class="card"><h3>What I can do</h3><div class="small muted" style="margin-bottom:8px">Your role: <b style="color:var(--text)">${esc(roleName(a.role))}</b></div>${PGROUPS.map(g=>{const ps=PERMS.filter(p=>p[1]===g&&can(p[0]));return ps.length?`<div class="kv"><span>${esc(g)}</span><span class="small" style="text-align:right">${ps.map(p=>esc(p[2])).join(', ')}</span></div>`:''}).join('')}</div>
   <div class="card"><h3>My recent actions</h3>${mine.map(l=>`<div class="kv"><span class="small">${esc(l.text)}</span><span class="tiny muted" style="white-space:nowrap">${rel(l.ts)}</span></div>`).join('')||'<div class="empty">Nothing yet</div>'}<div class="hint mt8">Last sign-in: ${a.lastLogin?fmtDTY(a.lastLogin):'—'} · Signed in ${a.logins||1} time(s)</div></div></div>`};

/* ========================= ACTIVITY LOG ========================= */
PAGES.audit=()=>{const L=ADM.log||[],af=UI.af,ps=perStart(UI.per.audit||'all');
  const list=L.filter(l=>(l.ts||0)>=ps&&(!af.who||l.by===af.who)&&(!af.cat||l.cat===af.cat)&&match(l.text,l.name,l.by));
  const {rows,html}=paged(list,50),who=[...new Set(L.map(l=>l.by))];
  return toolbar('Search what happened',null,`${perSel()}<select class="inp" data-in="aw" style="width:200px" aria-label="Admin"><option value="">All admins</option>${who.map(w=>`<option value="${esc(w)}" ${af.who===w?'selected':''}>${esc(w)}</option>`).join('')}</select><select class="inp" data-in="ac" style="width:160px" aria-label="Area"><option value="">All areas</option>${Object.entries(CATS).map(([k,l])=>`<option value="${k}" ${af.cat===k?'selected':''}>${l}</option>`).join('')}</select>${can('export')?`<button class="btn line sm" data-act="exportLog">${ic('down')}Download</button>`:''}`)+
  `<div class="tblwrap"><table class="tbl"><thead><tr><th>When</th><th>Who</th><th>Area</th><th>What happened</th></tr></thead><tbody>${rows.map(l=>`<tr><td class="small" style="white-space:nowrap">${fmtDTY(l.ts)}<div class="tiny muted">${rel(l.ts)}</div></td><td class="small"><b>${esc(l.name||l.by)}</b><div class="tiny muted">${esc(l.by)}${l.role?' · '+esc(l.role):''}</div></td><td><span class="badge ${l.cat==='auth'?'info':l.cat==='data'||l.cat==='team'?'bad':l.cat==='money'?'warn':''}">${esc(CATS[l.cat]||l.cat||'—')}</span></td><td>${esc(l.text)}</td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">Nothing found</div></td></tr>'}</tbody></table></div>${html}`};

/* ========================= DRAWERS ========================= */
function drawerHTML(){const d=UI.drawer;if(d.t==='pax')return paxDrawer(d.id);if(d.t==='drv')return drvDrawer(d.id);if(d.t==='trip')return tripDrawer(d.u,d.id);return''}
const dh=(title,sub,av)=>`<div class="dh">${av||''}<div class="grow"><div class="b" style="font-size:17px">${title}</div><div class="small muted">${sub||''}</div></div><button class="btn line sm" data-act="closeDrawer" aria-label="Close">${ic('x')}</button></div>`;
function notesCard(id,p){const N=ADM.notes[id]||[];return `<div class="card mt12"><div class="row between"><h3 style="margin:0">${ic('note')} Private notes</h3>${can(p+'.edit')?`<button class="btn line sm" data-act="noteAdd" data-id="${id}">${ic('plus')}Add note</button>`:''}</div><div class="hint mt8">Only admins see these notes. The user never sees them.</div>${N.map(n=>`<div class="kv"><span style="color:var(--text)"><span class="small">${esc(n.text)}</span><span class="tiny muted" style="display:block">${esc(n.byName||n.by)} · ${fmtDT(n.ts)}</span></span>${n.by===me().email||me().role==='super'?`<button class="btn ghost sm" data-act="noteDel" data-u="${id}" data-id="${n.id}">Delete</button>`:''}</div>`).join('')||'<div class="muted small mt8">No notes yet</div>'}</div>`}
function paxDrawer(id){const u=DB.users[id];if(!u)return dh('This account no longer exists');const trips=(u.trips||[]).slice().sort((a,b)=>(b.created||b.ts||0)-(a.created||a.ts||0));

   ${u.suspended?`<div class="callout bad" style="margin-bottom:12px">${ic('lock')}<div><b style="color:var(--bad)">Suspended</b> ${u.suspendedAt?'since '+fmtD(u.suspendedAt):''}<div class="small">${esc(u.suspendReason||'')}</div></div></div>`:''}

function modal(title,body,okLabel,onOk,danger,wide){UI.modal={html:`<h3>${title}</h3><form id="modalf" class="col">${body}<div class="row" style="justify-content:flex-end;gap:8px"><button class="btn line" type="button" data-act="modalClose">Cancel</button>${okLabel?`<button class="btn ${danger?'bad':''}" type="submit">${okLabel}</button>`:''}</div></form>`,onOk,wide};render();setTimeout(()=>{const f=$('#modalf input:not([type=hidden]):not([readonly]),#modalf textarea,#modalf select');if(f)f.focus()},30)}
const closeModal=()=>{UI.modal=null;render()};
function infoModal(title,html){UI.modal={html:`<h3>${title}</h3>${html}<div class="row mt16" style="justify-content:flex-end"><button class="btn" type="button" data-act="modalClose">Done</button></div>`};render()}

 <div class="card mt12" style="background:var(--surface2)"><div class="kv"><span>Panel link</span><span class="small">${esc(location.href.split('#')[0])}</span></div><div class="kv"><span>Email</span><b>${esc(a.email)}</b></div><div class="kv"><span>Temporary password</span><b style="font-family:monospace;font-size:15px">${esc(pw)}</b></div></div>
 <button class="btn line mt12" type="button" data-act="copyText" data-t="${esc('Smart Safe Ride admin panel\n'+location.href.split('#')[0]+'\nEmail: '+a.email+'\nTemporary password: '+pw)}">${ic('copy')}Copy details</button><div class="hint mt8">This password is shown only once.</div>`)}

ACT.unsuspend=e=>{const u=DB.users[e.dataset.id];if(!need(uk(u)+'.block'))return;patch(u.id,[{t:'set',path:'suspended',v:false},{t:'set',path:'suspendReason',v:''},nOp('Account reactivated','Your Smart Safe Ride account is active again.','safety')],`Reactivated ${u.mode==='driver'?'driver':'passenger'} ${u.name}`,uk(u));toast('Account reactivated')};
ACT.delUser=e=>{const u=DB.users[e.dataset.id];if(!need(uk(u)+'.delete'))return;modal('Delete '+esc(u.name)+'?',`<div class="callout bad">${ic('alert')}<div class="small">This removes the account and all its history for good. It cannot be undone. Type <b>DELETE</b> to confirm.</div></div><input class="inp" id="m_c" placeholder="DELETE" autocomplete="off">`,'Delete for good',()=>{if($('#m_c').value.trim()!=='DELETE')return toast('Type DELETE to confirm');patch(u.id,[{t:'del'}],`Deleted ${u.mode==='driver'?'driver':'passenger'} account ${u.name} (${u.phone})`,uk(u));UI.drawer=null;delete ADM.notes[u.id];saveAdm();closeModal();toast('Account deleted')},true)};
ACT.adjWallet=e=>{if(!need('pax.money'))return;const u=DB.users[e.dataset.id];modal('Change wallet — '+esc(u.name),`<div class="callout">${ic('wallet')}<div class="small">Current balance: <b>${money(u.wallet)}</b>. Type a plus number to add money, or a minus number to take money away.</div></div><label class="fld">Amount (Rs)<input class="inp" id="m_a" type="number" step="10" placeholder="e.g. 200 or -150"></label><label class="fld">Reason (the user sees this)<input class="inp" id="m_n" placeholder="e.g. Sorry for the late driver"></label>`,'Apply',()=>{const a=Math.round(+$('#m_a').value);if(!a)return toast('Enter an amount');if(Math.abs(a)>100000)return toast('That amount is too large');const n=$('#m_n').value.trim()||'Admin adjustment';patch(u.id,[{t:'add',path:'wallet',v:a},{t:'unshift',path:'txs',max:100,v:{id:uid(),ts:Date.now(),kind:a>0?'in':'out',amount:Math.abs(a),tk:'tx_admin',vars:{}}},nOp(a>0?'Wallet credited':'Wallet adjusted',(a>0?'Rs '+a+' added to':'Rs '+(-a)+' taken from')+' your wallet. '+n)],`Wallet ${a>0?'+':''}${a} for ${u.name}: ${n}`,'money');closeModal();toast('Wallet updated')})};
ACT.adjBal=e=>{if(!need('drv.money'))return;const u=DB.users[e.dataset.id];modal('Change driver balance — '+esc(u.name),`<div class="callout">${ic('wallet')}<div class="small">Current balance: <b>${money(u.driver.bal)}</b>. Drivers need at least ${money(minBal())} to go online. Use a minus number to take money away.</div></div><label class="fld">Amount (Rs)<input class="inp" id="m_a" type="number" step="10"></label><label class="fld">Reason (the driver sees this)<input class="inp" id="m_n" placeholder="e.g. Fuel bonus"></label>`,'Apply',()=>{const a=Math.round(+$('#m_a').value);if(!a)return toast('Enter an amount');if(Math.abs(a)>100000)return toast('That amount is too large');const n=$('#m_n').value.trim()||'Admin adjustment';patch(u.id,[{t:'add',path:'driver.bal',v:a},{t:'unshift',path:'driver.txs',max:100,v:{id:uid(),type:'admin',amt:a,note:n,ts:Date.now()}},nOp('Balance updated',(a>0?'Rs '+a+' added to':'Rs '+(-a)+' taken from')+' your driver balance. '+n)],`Driver balance ${a>0?'+':''}${a} for ${u.name}: ${n}`,'money');closeModal();toast('Balance updated')})};
ACT.forceOff=e=>{if(!need('drv.edit'))return;const u=DB.users[e.dataset.id];patch(u.id,[{t:'set',path:'driver.online',v:false},nOp('You were set offline','An admin set your status to offline.','safety')],`Set driver ${u.name} offline`,'drv');toast('Driver set offline')};
function approveOps(u){const d=u.driver,ops=[{t:'set',path:'driver.status',v:'approved'},{t:'set',path:'driver.approvedAt',v:Date.now()},{t:'set',path:'driver.review',v:null},{t:'set',path:'driver.rejReason',v:''},nOp('You’re approved to drive!','Your documents were checked by our team. Go online to start getting ride requests.','ride')];
  if(d.vehicle&&d.vehicle.type==='lux'){ops.push({t:'set',path:'driver.online',v:true});(d.lux||[]).filter(l=>!l.deleted).forEach(l=>ops.push({t:'mkPut',col:'lux',key:l.id,v:{...l,owner:u.id,ownerName:u.name,orating:null,status:l.paused?'off':'on'}}))}return ops}
ACT.approveDrv=e=>{if(!need('drv.approve'))return;const u=DB.users[e.dataset.id];patch(u.id,approveOps(u),`Approved driver ${u.name}`,'drv');toast('Driver approved — they can start driving')};
ACT.rejectDrv=e=>{if(!need('drv.approve'))return;const u=DB.users[e.dataset.id];modal((u.driver.status==='approved'?'Stop ':'Reject ')+esc(u.name),`<label class="fld">Reason (the driver sees this)<select class="inp" id="m_s"><option>Document photo is not clear</option><option>CNIC does not match the details</option><option>Driving licence expired or invalid</option><option>Vehicle registration does not match</option><option>Selfie does not match CNIC</option><option>Other</option></select></label><label class="fld">More details (optional)<textarea class="inp" id="m_r" rows="2"></textarea></label><div class="hint">The driver can fix the problem in the app and send the application again.</div>`,'Reject',()=>{const r=$('#m_s').value+($('#m_r').value.trim()?' — '+$('#m_r').value.trim():'');patch(u.id,[{t:'set',path:'driver.status',v:'rejected'},{t:'set',path:'driver.rejReason',v:r},{t:'set',path:'driver.review',v:null},{t:'set',path:'driver.online',v:false},nOp('Application needs changes',r+'. Open the app to fix and send again.','safety')],`Rejected driver ${u.name}: ${r}`,'drv');closeModal();toast('Driver rejected')},true)};
ACT.notifyOne=e=>{const u=DB.users[e.dataset.id];if(!need(uk(u)+'.edit'))return;modal('Send a message to '+esc(u.name),`<div class="hint">It appears in their notifications list in the app.</div><label class="fld">Title<input class="inp" id="m_t" maxlength="60"></label><label class="fld">Message<textarea class="inp" id="m_m" rows="3" maxlength="300"></textarea></label>`,'Send',()=>{const t=$('#m_t').value.trim(),m=$('#m_m').value.trim();if(!t||!m)return toast('Please write a title and a message');patch(u.id,[nOp(t,m)],`Sent a message to ${u.name}: ${t}`,'msg');closeModal();toast('Message sent')})};
ACT.editPax=e=>{if(!need('pax.edit'))return;const u=DB.users[e.dataset.id];modal('Edit '+esc(u.name),`<label class="fld">Full name<input class="inp" id="m_n" value="${esc(u.name)}" maxlength="50"></label><label class="fld">Email<input class="inp" id="m_e" type="email" value="${esc(u.email||'')}"></label><label class="fld">Gender<select class="inp" id="m_g"><option value="">Not set</option>${['male','female','other'].map(g=>`<option value="${g}" ${u.gender===g?'selected':''}>${g[0].toUpperCase()+g.slice(1)}</option>`).join('')}</select></label><label class="fld">Phone<input class="inp" value="${esc(u.phone)}" readonly><span class="fhelp">The phone number is used to sign in, so it cannot be changed here.</span></label>`,'Save',()=>{const n=$('#m_n').value.trim(),em=$('#m_e').value.trim(),g=$('#m_g').value;if(n.length<2)return toast('Name is too short');if(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return toast('That email does not look right');const ch=[];if(n!==u.name)ch.push(`name "${u.name}" → "${n}"`);if(em!==(u.email||''))ch.push(`email → ${em||'(empty)'}`);if(g!==(u.gender||''))ch.push(`gender → ${g||'(empty)'}`);if(!ch.length){closeModal();return}const ops=[{t:'set',path:'name',v:n},{t:'set',path:'email',v:em}];if(g)ops.push({t:'set',path:'gender',v:g});if(g!=='female'&&u.womenVerified)ops.push({t:'set',path:'womenVerified',v:false});patch(u.id,ops,`Edited passenger ${u.name}: ${ch.join(', ')}`,'pax');closeModal();toast('Saved')})};
ACT.editDrv=e=>{if(!need('drv.edit'))return;const u=DB.users[e.dataset.id],d=u.driver;modal('Edit '+esc(u.name),`<label class="fld">Full name<input class="inp" id="m_n" value="${esc(u.name)}" maxlength="50"></label><div class="row wrap" style="gap:10px"><label class="fld grow">CNIC expiry date<input class="inp" id="m_ce" type="date" value="${esc(d.cnicExp||'')}"></label><label class="fld grow">Licence expiry date<input class="inp" id="m_le" type="date" value="${esc(d.licExp||'')}"></label></div><div class="hint">Fix expiry dates here if the driver typed them wrong. Check the document photos first.</div>`,'Save',()=>{const n=$('#m_n').value.trim(),ce=$('#m_ce').value,le=$('#m_le').value;if(n.length<2)return toast('Name is too short');const ch=[];if(n!==u.name)ch.push(`name → "${n}"`);if(ce!==(d.cnicExp||''))ch.push(`CNIC expiry → ${ce||'(empty)'}`);if(le!==(d.licExp||''))ch.push(`licence expiry → ${le||'(empty)'}`);if(!ch.length){closeModal();return}patch(u.id,[{t:'set',path:'name',v:n},{t:'set',path:'driver.cnicExp',v:ce},{t:'set',path:'driver.licExp',v:le}],`Edited driver ${u.name}: ${ch.join(', ')}`,'drv');closeModal();toast('Saved')})};
ACT.noteAdd=e=>{const id=e.dataset.id,u=DB.users[id];if(!need(uk(u)+'.edit'))return;modal('Add a private note',`<div class="hint">Only admins see this. Good for things like "Called on 12 Oct, promised refund".</div><textarea class="inp" id="m_t" rows="4" maxlength="500"></textarea>`,'Save note',()=>{const t=$('#m_t').value.trim();if(!t)return toast('Write something first');const a=me();UI.modal=null;admEdit(A=>{(A.notes[id]=A.notes[id]||[]).unshift({id:uid(),ts:Date.now(),by:a.email,byName:a.name,text:t})},`Added a note on ${u?u.name:id}`,uk(u));toast('Note saved')})};
ACT.noteDel=e=>{const uidv=e.dataset.u,id=e.dataset.id;admEdit(A=>{A.notes[uidv]=(A.notes[uidv]||[]).filter(n=>n.id!==id)},'Deleted a private note',uk(DB.users[uidv]));toast('Note deleted')};
ACT.womenSet=e=>{if(!need('safe.manage'))return;const on=e.dataset.v==='1',u=DB.users[e.dataset.id];patch(u.id,[{t:'set',path:'womenVerified',v:on},nOp(on?'Women Route verified':'Women Route removed',on?'You can now book Women Route rides.':'Please verify again from the Women Route screen.','safety')],`${on?'Approved':'Removed'} Women Route for ${u.name}`,'safety');toast(on?'Approved':'Removed')};
ACT.womenReject=e=>{if(!need('safe.manage'))return;const u=DB.users[e.dataset.id];modal('Reject Women Route check',`<label class="fld">Reason (she sees this)<select class="inp" id="m_s"><option>Selfie is not clear</option><option>Selfie does not match the CNIC</option><option>CNIC details are not readable</option><option>Other</option></select></label>`,'Reject',()=>{const r=$('#m_s').value;patch(u.id,[{t:'set',path:'womenVerified',v:false},{t:'set',path:'womenVer',v:null},nOp('Women Route check not approved',r+'. Please try the verification again.','safety')],`Rejected Women Route check for ${u.name}: ${r}`,'safety');closeModal();toast('Rejected')},true)};

/* ---- bulk ---- */
const selUsers=()=>[...UI.sel].map(id=>DB.users[id]).filter(Boolean);
ACT.bulkNotify=()=>{const L=selUsers();const p=UI.page==='drivers'?'drv':'pax';if(!need(p+'.edit'))return;modal(`Send a message to ${L.length} people`,`<label class="fld">Title<input class="inp" id="m_t" maxlength="60"></label><label class="fld">Message<textarea class="inp" id="m_m" rows="3" maxlength="300"></textarea></label>`,'Send',()=>{const t=$('#m_t').value.trim(),m=$('#m_m').value.trim();if(!t||!m)return toast('Please write a title and a message');UI.modal=null;sendBroadcast(L.map(u=>u.id),t,m,'selected');UI.sel.clear();render();toast('Sent to '+L.length)})};
ACT.bulkSuspend=()=>{const L=selUsers().filter(u=>!u.suspended);const p=UI.page==='drivers'?'drv':'pax';if(!need(p+'.block'))return;if(!L.length)return toast('Everyone selected is already suspended');modal(`Suspend ${L.length} account(s)?`,`<label class="fld">Reason (they see this)<textarea class="inp" id="m_r" rows="3"></textarea></label>`,'Suspend all',()=>{const r=$('#m_r').value.trim();if(!r)return toast('Please write a reason');UI.modal=null;L.forEach(u=>{const ops=[{t:'set',path:'suspended',v:true},{t:'set',path:'suspendReason',v:r},{t:'set',path:'suspendedAt',v:Date.now()}];if(u.driver)ops.push({t:'set',path:'driver.online',v:false});patch(u.id,ops,`Suspended ${u.name}: ${r}`,p)});UI.sel.clear();render();toast(L.length+' suspended')},true)};
ACT.bulkUnsuspend=()=>{const L=selUsers().filter(u=>u.suspended);const p=UI.page==='drivers'?'drv':'pax';if(!need(p+'.block'))return;if(!L.length)return toast('No suspended accounts selected');L.forEach(u=>patch(u.id,[{t:'set',path:'suspended',v:false},{t:'set',path:'suspendReason',v:''},nOp('Account reactivated','Your Smart Safe Ride account is active again.','safety')],`Reactivated ${u.name}`,p));UI.sel.clear();render();toast(L.length+' reactivated')};
ACT.bulkApprove=()=>{if(!need('drv.approve'))return;const L=selUsers().filter(u=>u.driver&&u.driver.status==='pending');if(!L.length)return toast('None of the selected drivers is waiting for approval');modal(`Approve ${L.length} driver(s)?`,`<div class="small">${L.map(u=>esc(u.name)).join(', ')}</div><div class="hint">Make sure you looked at their documents first.</div>`,'Approve',()=>{UI.modal=null;L.forEach(u=>patch(u.id,approveOps(u),`Approved driver ${u.name}`,'drv'));UI.sel.clear();render();toast(L.length+' approved')})};
ACT.bulkExport=e=>{const L=selUsers();e.dataset.k==='drv'?csv('drivers-selected',L.filter(u=>u.driver).map(drvRow)):csv('passengers-selected',L.map(paxRow))};

/* ---- rides & services ---- */
ACT.cancelTrip=e=>{if(!need('ride.manage'))return;const u=DB.users[e.dataset.u],tr=(u.trips||[]).find(z=>z.id===e.dataset.id);modal('Cancel this booking?',`<label class="fld">Reason (the passenger sees this)<input class="inp" id="m_r" placeholder="e.g. Driver not available"></label>${tr.prepaid&&tr.pay!=='cash'&&!tr.refunded?`<div class="callout ok">${ic('refund')}<div class="small">${money(tr.total)} will go back to the passenger's wallet automatically.</div></div>`:''}`,'Cancel booking',()=>{const r=$('#m_r').value.trim()||'Cancelled by Smart Safe Ride';const refund=tr.prepaid&&tr.pay!=='cash'&&!tr.refunded;const ops=[{t:'arrSet',path:'trips',id:tr.id,v:{status:'cancelled',cancelReason:'admin: '+r,cancelledAt:Date.now(),refunded:tr.refunded||refund}}];if(refund)ops.push({t:'add',path:'wallet',v:tr.total},{t:'unshift',path:'txs',max:100,v:{id:uid(),ts:Date.now(),kind:'in',amount:tr.total,tk:'tx_refund',vars:{}}});ops.push(nOp('Booking cancelled',r+(refund?' Your payment was refunded to your wallet.':''),'ride'));if(M().reqs&&M().reqs[tr.id])ops.push({t:'mk',col:'reqs',key:tr.id,v:{status:'cancelled'}});patch(u.id,ops,`Cancelled booking ${tr.code||tr.id} for ${u.name}: ${r}`,'ride');closeModal();toast('Booking cancelled')},true)};
ACT.refundTrip=e=>{if(!need('ride.manage'))return;const u=DB.users[e.dataset.u],tr=(u.trips||[]).find(z=>z.id===e.dataset.id),left=refundLeft(tr);modal('Refund to wallet',`<div class="callout">${ic('refund')}<div class="small">The money goes into ${esc(u.name)}'s app wallet. They can spend it on their next rides.</div></div><label class="fld">Amount (Rs) — up to ${money(left)}<input class="inp" id="m_a" type="number" min="1" max="${left}" value="${left}"></label><label class="fld">Reason (the passenger sees this)<input class="inp" id="m_n" placeholder="e.g. Driver took a longer route"></label>`,'Refund',()=>{const a=Math.round(+$('#m_a').value);if(!(a>0))return toast('Enter an amount');if(a>left)return toast('You can refund up to '+money(left));const n=$('#m_n').value.trim()||'Refund from Smart Safe Ride';patch(u.id,[{t:'add',path:'wallet',v:a},{t:'unshift',path:'txs',max:100,v:{id:uid(),ts:Date.now(),kind:'in',amount:a,tk:'tx_refund',vars:{}}},{t:'arrSet',path:'trips',id:tr.id,v:{refundAmt:(tr.refundAmt||0)+a}},nOp('Refund added','Rs '+a+' was added to your wallet for booking '+(tr.code||'')+'. '+n,'ride')],`Refunded ${money(a)} to ${u.name} for booking ${tr.code||tr.id}: ${n}`,'money');closeModal();toast('Refund added to wallet')})};
ACT.routeToggle=e=>{if(!need('svc.manage'))return;const r=M().routes[e.dataset.id];if(!r)return;const on=r.status!=='on',du=DB.users[r.drv];const ops=[{t:'mk',col:'routes',key:r.id,v:{status:on?'on':'off',adminOff:!on}}];if(du&&du.driver){ops.push({t:'arrSet',path:'driver.routes',id:r.id,v:{paused:!on}});if(!on)ops.push(nOp('Route switched off by admin','Your route '+routeName(r)+' was switched off. Contact support for details.','ride'))}patch(du?du.id:null,ops,`Switched ${on?'on':'off'} route ${routeName(r)}`,'svc');toast(on?'Route is live again':'Route switched off')};
ACT.luxToggle=e=>{if(!need('svc.manage'))return;const l=M().lux[e.dataset.id];if(!l)return;const on=l.status!=='on',ou=DB.users[l.owner];const ops=[{t:'mk',col:'lux',key:l.id,v:{status:on?'on':'off',adminOff:!on}}];if(ou&&ou.driver){ops.push({t:'arrSet',path:'driver.lux',id:l.id,v:{paused:!on}});if(!on)ops.push(nOp('Listing taken down',l.en+' was removed from Luxury Vehicles by an admin.','ride'))}patch(ou?ou.id:null,ops,`${on?'Put back':'Took down'} luxury listing ${l.en}`,'svc');toast('Listing updated')};
ACT.closePost=e=>{if(!need('svc.manage'))return;const p=M().posts[e.dataset.id];if(!p)return;modal('Close this monthly request?',`<div class="small">Drivers will no longer see it. ${esc(p.paxName)} gets a message.</div><label class="fld">Reason (optional)<input class="inp" id="m_r"></label>`,'Close request',()=>{const r=$('#m_r').value.trim();const ops=[{t:'mk',col:'posts',key:p.id,v:{status:'closed',adminClosed:true}}];if(DB.users[p.pax])ops.push(nOp('Monthly request closed','Your monthly commute request was closed by our team.'+(r?' '+r:''),'ride'));patch(DB.users[p.pax]?p.pax:null,ops,`Closed monthly request from ${p.paxName}${r?': '+r:''}`,'svc');closeModal();toast('Request closed')},true)};
ACT.hideMsg=e=>{if(!need('comm.manage'))return;const id=e.dataset.id;admEdit(A=>{const h=A.settings.hiddenMsgs=A.settings.hiddenMsgs||[];const i=h.indexOf(id);if(i>=0)h.splice(i,1);else h.push(id)},`${(S().hiddenMsgs||[]).includes(id)?'Showed again':'Hid'} a community message`,'comm')};
ACT.delGroup=e=>{if(!need('comm.manage'))return;modal('Delete this group?','<div class="small">Members will no longer find it in Community.</div>','Delete group',()=>{const g=groups().find(x=>x.id===e.dataset.id);patch(null,[{t:'mk',col:'cnets',key:e.dataset.id,v:{status:'del'}}],`Deleted community group ${g?g.name:e.dataset.id}`,'comm');closeModal();toast('Group deleted')},true)};

/* ---- safety & support ---- */
ACT.sosSet=e=>{if(!need('safe.manage'))return;const s=e.dataset.s,x=M().sos[e.dataset.id];modal(s==='resolved'?'Close this SOS alert':'Send help',`<label class="fld">Note${s==='dispatched'?' (who did you send?)':''}<input class="inp" id="m_n" placeholder="${s==='resolved'?'e.g. Called her, she is safe at home':'e.g. Police 15 unit sent'}"></label><div class="hint">The user gets a message in the app.</div>`,s==='resolved'?'Close alert':'Mark help as sent',()=>{const n=$('#m_n').value.trim();const u=DB.users[x.user];const ops=[{t:'mk',col:'sos',key:x.id,v:{status:s,note:n,by:me().name}}];if(u)ops.push(nOp(s==='resolved'?'SOS closed by safety team':'Help is on the way',n||(s==='resolved'?'Our safety team closed your SOS alert.':'Help has been sent to your location.'),'safety'));patch(u?u.id:null,ops,`SOS from ${x.name} → ${s==='resolved'?'closed':'help sent'}${n?': '+n:''}`,'safety');closeModal();toast('SOS updated')})};
ACT.ticketReply=e=>{if(!can('sup.reply')&&!can('safe.manage'))return need('sup.reply');const u=DB.users[e.dataset.u],tk=(u&&u.tickets||[]).find(x=>x.id===e.dataset.id);if(!tk)return toast('Ticket not found');modal('Reply to '+esc(tk.ref),`<div class="small" style="background:var(--surface2);padding:10px;border-radius:10px"><b>${esc(u.name)}:</b> ${esc(tk.msg)}</div><label class="fld">Your reply (the user sees this)<textarea class="inp" id="m_r" rows="3">${esc(tk.reply||'')}</textarea></label><label class="row small"><input type="checkbox" id="m_res" ${tk.status==='resolved'?'checked':''}> Mark as resolved</label>`,'Save reply',()=>{const r=$('#m_r').value.trim(),res=$('#m_res').checked;patch(u.id,[{t:'arrSet',path:'tickets',id:tk.id,v:{reply:r,status:res?'resolved':'open',replyAt:Date.now()}},nOp('Update on '+tk.ref,r||(res?'Your report has been resolved.':'We are looking into your report.'),'safety')],`Replied to ticket ${tk.ref}${res?' and marked it resolved':''}`,'support');closeModal();toast('Reply saved')})};
ACT.openThread=e=>{UI.thread=e.dataset.id;const th=M().support&&M().support[e.dataset.id];if(th&&th.adminUnread&&can('sup.reply'))patch(null,[{t:'mk',col:'support',key:th.id,v:{adminUnread:0}}]);else render();setTimeout(()=>{const c=$('#chatbox');if(c)c.scrollTop=c.scrollHeight},0)};
ACT.closeThread=e=>{if(!need('sup.reply'))return;const th=M().support[e.dataset.id];patch(null,[{t:'mk',col:'support',key:e.dataset.id,v:{status:'closed'}}],`Closed support chat with ${th?th.name:''}`,'support')};
ACT.assignMe=e=>{if(!need('sup.reply'))return;const id=e.dataset.id,th=M().support[id],a=me();admEdit(A=>{A.assign[id]=a.id},`Took support chat with ${th?th.name:''}`,'support');toast('This chat is now yours')};
ACT.editQuick=()=>{if(!need('sup.reply'))return;modal('Saved replies',`<div class="hint">One reply per line. They appear in the "Saved replies" list when you answer a chat.</div><textarea class="inp" id="m_q" rows="8">${esc(quick().join('\n'))}</textarea>`,'Save',()=>{const L=$('#m_q').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,30);UI.modal=null;admEdit(A=>{A.settings.quickReplies=L},'Updated saved support replies','support');toast('Saved')},false,true)};

/* ========================= GLOBAL SEARCH ========================= */
function gsearch(q){const box=$('#gres');if(!box)return;q=q.trim().toLowerCase();if(q.length<2){box.hidden=true;return}
  const hit=(...v)=>v.some(x=>String(x||'').toLowerCase().includes(q));let h='';
  if(can('pax.view')){const L=passengers().filter(u=>hit(u.name,u.phone,u.email)).slice(0,6);if(L.length)h+=`<div class="gh">PASSENGERS</div>`+L.map(u=>`<button class="gi" data-act="openPax" data-id="${u.id}">${avatar(u,'sm')}<span class="grow"><b class="small">${esc(u.name)}</b><span class="tiny muted" style="display:block">${esc(u.phone)}</span></span></button>`).join('')}
  if(can('drv.view')){const L=drivers().filter(u=>hit(u.name,u.phone,u.driver.cnic,(u.driver.vehicle||{}).plate)).slice(0,6);if(L.length)h+=`<div class="gh">DRIVERS</div>`+L.map(u=>`<button class="gi" data-act="openDriver" data-id="${u.id}">${avatar(u,'sm')}<span class="grow"><b class="small">${esc(u.name)}</b><span class="tiny muted" style="display:block">${esc(u.phone)} · ${esc(vehLine(u.driver))}</span></span></button>`).join('')}
  if(can('ride.view')){const L=allTrips().filter(t=>hit(t.code)).slice(0,6);if(L.length)h+=`<div class="gh">BOOKINGS</div>`+L.map(t=>`<button class="gi" data-act="openTrip" data-u="${t._u}" data-id="${t.id}"><span class="av sm">${ic('ride')}</span><span class="grow"><b class="small">${esc(t.code)}</b><span class="tiny muted" style="display:block">${esc(t._name)} · ${money(t.total)} · ${esc(ST_LABEL[t.status]||t.status)}</span></span></button>`).join('')}
  box.innerHTML=h||'<div class="empty small">No match</div>';box.hidden=false}

/* ========================= 2-STEP SIGN-IN (TOTP, works with Google / Microsoft Authenticator) ========================= */
function sha1b(bytes){const ml=bytes.length*8,withOne=bytes.length+1,k=(64-((withOne+8)%64))%64,len=withOne+k+8,m=new Uint8Array(len);m.set(bytes);m[bytes.length]=0x80;const dv=new DataView(m.buffer);dv.setUint32(len-4,ml>>>0);dv.setUint32(len-8,Math.floor(ml/2**32));
  let h0=0x67452301,h1=0xEFCDAB89,h2=0x98BADCFE,h3=0x10325476,h4=0xC3D2E1F0;const w=new Uint32Array(80);const rl=(x,n)=>(x<<n)|(x>>>(32-n));
  for(let i=0;i<len;i+=64){for(let j=0;j<16;j++)w[j]=dv.getUint32(i+j*4);for(let j=16;j<80;j++)w[j]=rl(w[j-3]^w[j-8]^w[j-14]^w[j-16],1);let a=h0,b=h1,c=h2,d=h3,e=h4;
    for(let j=0;j<80;j++){const f=j<20?(b&c)|(~b&d):j<40?b^c^d:j<60?(b&c)|(b&d)|(c&d):b^c^d,kk=j<20?0x5A827999:j<40?0x6ED9EBA1:j<60?0x8F1BBCDC:0xCA62C1D6;const tmp=(rl(a,5)+f+e+kk+w[j])>>>0;e=d;d=c;c=rl(b,30)>>>0;b=a;a=tmp}
    h0=(h0+a)>>>0;h1=(h1+b)>>>0;h2=(h2+c)>>>0;h3=(h3+d)>>>0;h4=(h4+e)>>>0}
  const out=new Uint8Array(20),ov=new DataView(out.buffer);[h0,h1,h2,h3,h4].forEach((h,i)=>ov.setUint32(i*4,h));return out}
function hmacSha1(key,msg){if(key.length>64)key=sha1b(key);const k=new Uint8Array(64);k.set(key);const ip=new Uint8Array(64+msg.length),op=new Uint8Array(84);for(let i=0;i<64;i++){ip[i]=k[i]^0x36;op[i]=k[i]^0x5c}ip.set(msg,64);op.set(sha1b(ip),64);return sha1b(op)}
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32enc(b){let bits=0,v=0,o='';for(const x of b){v=(v<<8)|x;bits+=8;while(bits>=5){o+=B32[(v>>>(bits-5))&31];bits-=5}}if(bits)o+=B32[(v<<(5-bits))&31];return o}
function b32dec(s){s=String(s).toUpperCase().replace(/[^A-Z2-7]/g,'');let bits=0,v=0;const o=[];for(const c of s){v=(v<<5)|B32.indexOf(c);bits+=5;if(bits>=8){o.push((v>>>(bits-8))&255);bits-=8}}return new Uint8Array(o)}
function totpAt(secret,step){const msg=new Uint8Array(8),dv=new DataView(msg.buffer);dv.setUint32(0,Math.floor(step/2**32));dv.setUint32(4,step>>>0);const h=hmacSha1(b32dec(secret),msg),o=h[19]&15;const n=((h[o]&127)<<24)|(h[o+1]<<16)|(h[o+2]<<8)|h[o+3];return String(n%1e6).padStart(6,'0')}
function totpOk(secret,code,t=Date.now()){code=String(code||'').replace(/\D/g,'');if(code.length!==6)return false;const st=Math.floor(t/30000);for(let d=-1;d<=1;d++)if(totpAt(secret,st+d)===code)return true;return false}

  const f=flt()||'all';const list=Lx.filter(l=>(f==='all'||(f==='fleet'&&l.owner===FLEET)||(f==='partner'&&l.owner!==FLEET)||(f==='off'&&l.status!=='on'))&&match(l.en,l.plate,l.ownerName));

  `<div class="grid g3">${list.map(l=>{const n=Rn.filter(r=>r.listing===l.id).length;return `<div class="card" style="padding:0;overflow:hidden"><div style="height:150px;background:${(l.photos||[])[0]?`url(${l.photos[0]}) center/cover`:`linear-gradient(135deg,${l.col||'#2A2340'},#6D28D9)`};position:relative;${(l.photos||[])[0]?'cursor:zoom-in':''}" ${(l.photos||[])[0]?`data-act="zoom" data-src="${esc(l.photos[0])}"`:''}>${(l.photos||[])[0]?'':`<div style="position:absolute;inset:0;display:grid;place-items:center;color:#fff;opacity:.7">${ic('crown')}</div>`}<span style="position:absolute;top:10px;left:10px">${l.status==='on'?'<span class="badge ok">Live</span>':l.adminOff?'<span class="badge bad">Hidden by admin</span>':'<span class="badge">Paused</span>'}</span>${l.owner===FLEET?'<span class="badge brand" style="position:absolute;top:10px;right:10px">Our fleet</span>':''}</div>
   <div style="padding:14px"><div class="row between"><b>${esc(l.en)}</b><b>${money(l.rate)}<span class="tiny muted">/hr</span></b></div><div class="tiny muted mt8">${esc(l.yr||'')} · ${esc(l.color||'')} · ${esc(l.plate||'')} · ${l.k==='bike'?'Bike':(l.seats||4)+' seats'} · ${esc(LUXMODE[l.mode]||l.mode||'')}</div><div class="tiny muted">${l.owner===FLEET?'Owned by Smart Safe Ride':'Partner: '+esc(l.ownerName||'—')} · ${n} booking${n===1?'':'s'}</div>

    toolbar('Search passenger',[['active','Active'],['ending','Ending soon'],['ended','Ended'],['all','All']],mg?`<button class="btn" data-act="planGive">${ic('plus')}Give a plan</button>`:'')+
    `<div class="tblwrap"><table class="tbl"><thead><tr><th>Passenger</th><th>Plan</th><th>Started</th><th>Ends</th><th>Rides used</th><th>Paid</th><th>Status</th><th></th></tr></thead><tbody>${list.map(u=>{const p=u.plan,pl=P[p.planId]||{en:p.planId,rides:0},on=p.status!=='cancelled'&&p.end>Date.now();return `<tr><td><div class="b">${esc(u.name)}</div><div class="tiny muted">${esc(u.phone)}</div></td><td><span class="badge brand">${esc(pl.en)}</span></td><td class="small">${fmtD(p.start)}</td><td class="small">${fmtD(p.end)}<div class="tiny muted">${on?rel(p.end):''}</div></td><td>${p.used||0} / ${pl.rides}</td><td>${money(p.price)}<div class="tiny muted">${esc(p.pay==='admin'?'given by admin':(p.pay||'').split(':')[0])}</div></td><td>${on?'<span class="badge ok">Active</span>':p.status==='cancelled'?'<span class="badge bad">Cancelled</span>':'<span class="badge">Ended</span>'}</td><td>${mg?`<div class="row" style="gap:6px;justify-content:flex-end"><button class="btn line sm" data-act="planExtend" data-id="${u.id}">${ic('clock')}Extend</button>${on?`<button class="btn line sm dl" data-act="planCancel" data-id="${u.id}">Cancel</button>`:''}</div>`:''}</td></tr>`}).join('')||`<tr><td colspan="8">${emptyBox('cal','No subscribers here','Passengers buy plans from Monthly in the app.')}</td></tr>`}</tbody></table></div>`}
  const cnt=id=>act.filter(u=>u.plan.planId===id).length;
  return tabs+headRow('These plans show in the app under <b>Monthly</b>. Changes work straight away for new purchases. People who already bought a plan keep their current rides and end date.',mg?`<button class="btn" data-act="planEdit">${ic('plus')}New plan</button>`:'')+
  `<div class="grid g3">${Object.entries(P).sort((a,b)=>a[1].price-b[1].price).map(([id,p])=>`<div class="plan ${p.off?'off':''}">${p.off?'<span class="badge ptag">Switched off</span>':p.pop?'<span class="badge brand ptag">Most popular</span>':p.best?'<span class="badge warn ptag">Best value</span>':''}

ACT.planEdit=e=>{if(!need('plan.manage'))return;const id=e.dataset.id,p=id?allPlans()[id]:{en:'',price:'',rides:20,pct:15,cap:200,kinds:['normal','women','luggage'],perks:['pk_rides','pk_pct','pk_support'],color:'#7C2AE8'};const ks=new Set(p.kinds||[]),ps=new Set(p.perks||[]),custom=(p.perks||[]).filter(k=>!PERKS[k]);

  <div class="grid g2"><label class="fld">Label<select class="inp" id="pl_t"><option value="">No label</option><option value="pop" ${p.pop?'selected':''}>Most popular</option><option value="best" ${p.best?'selected':''}>Best value</option></select></label><label class="fld">Colour<input class="inp" id="pl_col" type="color" value="${esc(p.color||'#7C2AE8')}" style="padding:4px;height:40px"></label></div>`,id?'Save plan':'Create plan',()=>{
