<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B133FF">
<title>Smart Safe Ride</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --brand:#B133FF; --brand-ink:#fff; --brand-text:#9B1FE6; --brand-deep:#7A16B8;
  --tint:#F4E6FF; --tint2:#EBD0FF;
  --bg:#FAF6FE; --surface:#FFFFFF; --surface2:#F3ECFA; --ink:#1B1225; --muted:#6B5F7B; --line:#E6DAF1;
  --gold:#B9862A; --gold-bg:#FFF4DC; --ok:#12995A; --ok-bg:#E2F6EC; --bad:#D6333F; --bad-bg:#FDE8EA; --warn:#B4700B; --warn-bg:#FFF0D6;
  --sea:#CFE3F7; --land:#F1ECF6; --park:#DDEFD9; --road:#FFFFFF; --road2:#E2D8EC; --maptext:#7C6F8D;
  --shadow:0 1px 2px rgba(45,20,70,.06),0 8px 24px rgba(45,20,70,.08);
  --font:'Outfit','Noto Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --lh:1.4; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand-text:#CE7BFF; --tint:#2E1A42; --tint2:#3E2358;
    --bg:#120A1B; --surface:#1C1228; --surface2:#261A36; --ink:#F5EEFB; --muted:#A99CBC; --line:#372749;
    --gold:#E3B45C; --gold-bg:#3A2D12; --ok:#3CCB86; --ok-bg:#12301F; --bad:#FF6B75; --bad-bg:#3A161B; --warn:#F0B34A; --warn-bg:#3A2A0D;
    --sea:#173047; --land:#1B1228; --park:#1D3323; --road:#2E2140; --road2:#3A2A50; --maptext:#8E80A3;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand-text:#CE7BFF; --tint:#2E1A42; --tint2:#3E2358;
  --bg:#120A1B; --surface:#1C1228; --surface2:#261A36; --ink:#F5EEFB; --muted:#A99CBC; --line:#372749;
  --gold:#E3B45C; --gold-bg:#3A2D12; --ok:#3CCB86; --ok-bg:#12301F; --bad:#FF6B75; --bad-bg:#3A161B; --warn:#F0B34A; --warn-bg:#3A2A0D;
  --sea:#173047; --land:#1B1228; --park:#1D3323; --road:#2E2140; --road2:#3A2A50; --maptext:#8E80A3;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
html[lang="ur"]{--font:'Noto Sans Arabic','Outfit',system-ui,sans-serif;--lh:1.7}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:var(--lh);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
h1,h2,h3,h4,p{margin:0}
a{color:var(--brand-text)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* stage & frame */
#stage{height:100%;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-items:center}
#side{display:none}
#app{position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
@media (min-width:1000px){
  #stage{grid-template-columns:minmax(0,1fr) 440px minmax(0,1fr);column-gap:48px;padding:0 32px}
  #side{display:flex;flex-direction:column;gap:18px;max-width:380px;justify-self:end;grid-column:1}
  #app{grid-column:2;height:min(100%,880px);max-height:100%;border-radius:36px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(80,20,120,.22)}
}
@media (min-width:441px) and (max-width:999px){
  #app{border-inline:1px solid var(--line)}
}
#screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scr{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:0 18px 22px;scrollbar-width:thin}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.top h1{font-size:19px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{flex:none;padding:12px 18px 16px;border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px}
.iconbtn{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);position:relative}
.iconbtn:active{transform:scale(.96)}
.iconbtn .dot{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
[dir=rtl] .flip{transform:scaleX(-1)}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:18px;height:18px} svg.i.lg{width:28px;height:28px}

/* type */
.h1{font-size:27px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.h2{font-size:20px;font-weight:650;line-height:1.3}
.h3{font-size:16px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.b{font-weight:600} .center{text-align:center}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wrap{overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:10px}.row>*,.col>*{min-width:0}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}.gap4{gap:4px}.gap6{gap:6px}.gap14{gap:14px}.gap18{gap:18px}
.wrapr{flex-wrap:wrap}.between{justify-content:space-between}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec h2{font-size:17px;font-weight:650}
.link{color:var(--brand-text);font-weight:600;font-size:14px;padding:4px 2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:16px;font-weight:650;font-size:16px;line-height:1.25;text-align:center;background:var(--brand);color:var(--brand-ink);width:100%;border:1px solid transparent;transition:transform .12s,opacity .12s;letter-spacing:.005em}
.btn:active{transform:scale(.985)}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.btn.sec2{background:var(--tint);color:var(--brand-text)}
.btn.line{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.bad{background:var(--bad-bg);color:var(--bad)}
.btn.solidbad{background:var(--bad);color:#fff}
.btn.sm{min-height:40px;padding:6px 14px;font-size:14px;border-radius:12px;width:auto}
.btn.ghost{background:transparent;color:var(--brand-text)}
.btn .spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* form */
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label{font-size:13px;font-weight:600;color:var(--muted)}
.inp{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;transition:border-color .15s,box-shadow .15s}
.inp:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.inp.err{border-color:var(--bad)}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;width:100%;border:0;background:transparent;outline:0;padding:12px 0;font-size:16px;text-overflow:ellipsis}
.inp textarea{resize:none;min-height:70px;line-height:1.4}
.inp svg{color:var(--muted)}
.inp .pre{color:var(--muted);font-weight:600;flex:none;direction:ltr;unicode-bidi:isolate}
.inp .eye{color:var(--muted);padding:6px;margin-inline-end:-6px}
.ferr{color:var(--bad);font-size:12.5px;font-weight:500;margin-top:-2px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:13.5px;line-height:1.45}
.banner.err{background:var(--bad-bg);color:var(--bad)} .banner.ok{background:var(--ok-bg);color:var(--ok)} .banner.info{background:var(--tint);color:var(--brand-text)} .banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner svg{margin-top:1px}

/* cards & lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.tap{width:100%;text-align:start;display:block}
.card.tap:active{transform:scale(.99)}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:start}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow .ic{width:40px;height:40px;border-radius:13px;background:var(--tint);color:var(--brand-text);display:grid;place-items:center;flex:none}
.lrow .ic.gold{background:var(--gold-bg);color:var(--gold)} .lrow .ic.ok{background:var(--ok-bg);color:var(--ok)} .lrow .ic.bad{background:var(--bad-bg);color:var(--bad)} .lrow .ic.plain{background:var(--surface2);color:var(--ink)}
.lrow .chev{color:var(--muted);flex:none}
.group{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:0 14px;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:13.5px;font-weight:550;white-space:nowrap;max-width:100%}
.chip.on{background:var(--tint);border-color:var(--brand);color:var(--brand-text)}
.chip.off{opacity:.45;pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.hs{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 6px;margin:0 -18px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:650;background:var(--tint);color:var(--brand-text);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.gold{background:var(--gold-bg);color:var(--gold)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.gray{background:var(--surface2);color:var(--muted)}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:38px;padding:6px 10px;border-radius:11px;font-weight:600;font-size:14px;text-align:center;color:var(--muted);line-height:1.2}
.seg button.on{background:var(--surface);color:var(--brand-text);box-shadow:0 1px 4px rgba(45,20,70,.12)}
.seg button[disabled]{opacity:.4}
.sw{position:relative;width:50px;height:30px;border-radius:15px;background:var(--line);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .2s}
.sw.on{background:var(--brand)} .sw.on::after{inset-inline-start:23px}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--tint2);color:var(--brand-deep);font-weight:700;font-size:17px;flex:none;overflow:hidden;background-size:cover;background-position:center}
.avatar.lg{width:84px;height:84px;font-size:30px}.avatar.sm{width:36px;height:36px;font-size:14px}
.stars{display:inline-flex;gap:2px;color:#F5A524}.stars svg{width:16px;height:16px;fill:currentColor;stroke:none}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface2);border-radius:12px;padding:3px}
.stepper button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface);color:var(--brand-text);font-weight:700}
.stepper button[disabled]{opacity:.35}
.stepper span{min-width:30px;text-align:center;font-weight:650}
.div{height:1px;background:var(--line);margin:12px 0}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:5px 0;font-size:14.5px}
.kv span:first-child{color:var(--muted)} .kv span:last-child{font-weight:600;text-align:end;min-width:0;overflow-wrap:anywhere}
.kv.tot{font-size:17px;padding-top:10px;border-top:1px dashed var(--line);margin-top:6px}.kv.tot span:first-child{color:var(--ink);font-weight:650}
.kv.disc span:last-child{color:var(--ok)}

/* skeleton / empty */
.sk{background:linear-gradient(90deg,var(--surface2) 25%,var(--tint) 50%,var(--surface2) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:14px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 20px}
.empty .eic{width:76px;height:76px;border-radius:26px;background:var(--tint);color:var(--brand-text);display:grid;place-items:center}

/* nav */
#nav{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px 8px}
#nav:empty{display:none}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:14px;line-height:1.2;text-align:center;position:relative}
#nav button.on{color:var(--brand-text)}
#nav button.on::before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--brand)}
#nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* sheets */
#layer{position:absolute;inset:0;z-index:40;pointer-events:none}
.bd{position:absolute;inset:0;background:rgba(20,8,32,.5);pointer-events:auto;animation:fade .2s}
.sheet{position:absolute;inset-inline:0;bottom:0;max-height:90%;display:flex;flex-direction:column;background:var(--surface);border-radius:26px 26px 0 0;pointer-events:auto;animation:up .26s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 4px;flex:none}
.sheet .sh{flex:none;display:flex;align-items:center;gap:10px;padding:8px 18px 6px}
.sheet .sh h2{flex:1;min-width:0;font-size:19px;font-weight:650}
.sheet .sb{flex:1;min-height:0;overflow-y:auto;padding:6px 18px 18px;overscroll-behavior:contain}
.sheet .sf{flex:none;padding:10px 18px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.dlg{position:absolute;inset:0;display:grid;place-items:center;padding:22px;pointer-events:none}
.dlg .box{width:100%;max-width:340px;background:var(--surface);border-radius:26px;padding:22px 20px 18px;pointer-events:auto;animation:pop .22s;display:flex;flex-direction:column;gap:12px;text-align:center;max-height:90%;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.94);opacity:0}}
#toasts{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));inset-inline:12px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-size:14px;font-weight:500;animation:drop .3s cubic-bezier(.2,.9,.3,1);line-height:1.4}
.toast .grow{overflow-wrap:anywhere}
.toast.nt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.toast.nt .ti{color:var(--brand-text)}
@keyframes drop{from{transform:translateY(-16px);opacity:0}}

/* map */
.map{position:relative;width:100%;direction:ltr;overflow:hidden;background:var(--sea)}
.map svg{display:block;width:100%;height:100%}
.map .ov{position:absolute;inset:0;pointer-events:none}
.pulse{animation:pl 2s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pl{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.6);opacity:0}}

/* home */
.hero{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);height:190px}
.hero .where{position:absolute;inset-inline:12px;bottom:12px;display:flex;align-items:center;gap:10px;min-height:54px;padding:0 14px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);text-align:start;width:calc(100% - 24px)}
.hero .where span.ph{flex:1;min-width:0;font-weight:600;font-size:16px}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cat{position:relative;display:flex;flex-direction:column;gap:10px;padding:14px;min-height:118px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);text-align:start;overflow:hidden}
.cat:active{transform:scale(.98)}
.cat .ci{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--tint);color:var(--brand-text)}
.cat.hi{background:var(--brand);border-color:var(--brand);color:#fff}.cat.hi .ci{background:rgba(255,255,255,.2);color:#fff}.cat.hi .cs{color:rgba(255,255,255,.88)}
.cat.gold .ci{background:var(--gold-bg);color:var(--gold)}
.cat .ct{font-weight:650;font-size:16px;line-height:1.25}.cat .cs{font-size:12.5px;color:var(--muted);line-height:1.35}
.cat.soon{cursor:pointer}
.cat.soon .blur{filter:blur(3.2px) saturate(.6);opacity:.65;display:flex;flex-direction:column;gap:10px}
.cat.soon .tag{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.cat.soon .tag span{background:var(--ink);color:var(--bg);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em;display:inline-flex;gap:6px;align-items:center}
.upc{display:flex;gap:12px;align-items:center;padding:14px;border-radius:20px;background:linear-gradient(135deg,var(--brand),#7A16B8);color:#fff;width:100%;text-align:start;box-shadow:0 10px 24px rgba(140,30,210,.3)}
.upc .ui{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.rt{display:flex;flex-direction:column;align-items:stretch;gap:0;position:relative}
.rt .rw{display:flex;gap:12px;align-items:center;min-height:38px;position:relative}
.rt .rw+.rw::before{content:"";position:absolute;inset-inline-start:7px;top:-14px;height:28px;border-inline-start:2px dotted var(--tint2)}
.rt .dt{width:16px;height:16px;border-radius:50%;border:4px solid var(--brand);background:var(--surface);flex:none}
.rt .sq{width:16px;height:16px;border-radius:5px;background:var(--ink);flex:none;transform:scale(.78)}

/* vehicle rows */
.veh{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);width:100%;text-align:start;position:relative}
.veh.on{border-color:var(--brand);background:var(--tint);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 16%,transparent)}
.veh.dis{opacity:.5;pointer-events:none}
.veh .vi{width:64px;height:44px;flex:none;display:grid;place-items:center}
.veh .vp{font-weight:700;font-size:16px;white-space:nowrap}
.veh+.veh{margin-top:8px}
.rate-star{width:44px;height:44px;color:var(--line)}
.rate-star.on{color:#F5A524}
.rate-star svg{width:100%;height:100%;fill:currentColor;stroke:none}
.otp{display:flex;gap:8px;justify-content:center;direction:ltr}
.otp input{width:46px;height:56px;text-align:center;font-size:24px;font-weight:700;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);outline:0;padding:0}
.otp input:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.pin{display:flex;gap:6px;direction:ltr}
.pin b{width:38px;height:46px;border-radius:12px;background:var(--surface);border:1.5px solid var(--brand);color:var(--brand-text);display:grid;place-items:center;font-size:22px}
.prog{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .3s linear}
.bubble{max-width:82%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--brand);color:#fff;border-end-end-radius:5px}
.bubble.dr{align-self:flex-start;background:var(--surface2);border-end-start-radius:5px}
.radar{position:relative;width:160px;height:160px;margin:6px auto;display:grid;place-items:center}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--brand);animation:pl 2s ease-out infinite;opacity:0}
.radar i:nth-child(2){animation-delay:.66s}.radar i:nth-child(3){animation-delay:1.33s}
.radar .core{width:70px;height:70px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;position:relative;box-shadow:0 8px 24px rgba(177,51,255,.5)}
.car3{position:relative}
.wm{display:flex;gap:6px;align-items:center}
.logo{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:16px;background:var(--brand);color:#fff;box-shadow:0 8px 22px rgba(177,51,255,.4)}
.logo svg{width:28px;height:28px}
.qr{padding:10px 12px;border-radius:14px;background:var(--surface2);font-size:13.5px;text-align:start;line-height:1.35}
.faq summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 0;font-weight:600}
.faq summary::-webkit-details-marker{display:none}
.faq details+details{border-top:1px solid var(--line)}
.faq details[open] summary svg{transform:rotate(90deg)}
.faq p{padding:0 0 14px;color:var(--muted);font-size:14px;line-height:1.6}
#side h1{font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
#side p{color:var(--muted);font-size:16px;line-height:1.6}
#side .pl{display:flex;flex-direction:column;gap:12px}
#side .pl div{display:flex;gap:12px;align-items:center;font-weight:550}
#side .pl svg{color:var(--brand-text)}
</style>
</head>

function roadPath(a,b,seed=0){
  const o=(hash(seed+'')%2)===0;const m=o?{x:a.x,y:b.y}:{x:b.x,y:a.y};
  const pts=[{x:a.x,y:a.y}];
  if(Math.abs(a.x-b.x)>.3&&Math.abs(a.y-b.y)>.3)pts.push(m);
  pts.push({x:b.x,y:b.y});return pts;
}
function polyLen(p){let l=0;for(let i=1;i<p.length;i++)l+=dist(p[i-1],p[i]);return l}
function pointAt(p,f){
  const tot=polyLen(p);if(tot===0)return{x:p[0].x,y:p[0].y,a:0};
  let d=clamp(f,0,1)*tot;
  for(let i=1;i<p.length;i++){const s=dist(p[i-1],p[i]);if(d<=s||i===p.length-1){const u=s?d/s:0;return{x:p[i-1].x+(p[i].x-p[i-1].x)*u,y:p[i-1].y+(p[i].y-p[i-1].y)*u,a:Math.atan2(p[i].y-p[i-1].y,p[i].x-p[i-1].x)*180/Math.PI}}d-=s}
  const l=p[p.length-1];return{x:l.x,y:l.y,a:0};
}

function notify(type,tk,bk,vars,link,quiet){
  const u=U();if(!u)return;
  u.notifs.unshift({id:uid(),ts:Date.now(),type,tk,bk,vars:vars||{},link:link||null,read:false});
  if(u.notifs.length>80)u.notifs.length=80;save();
  const pref={ride:'ride',offer:'offers',safety:'safety'}[type];
  if(!quiet&&(!pref||u.prefs[pref]!==false))toast(t(tk,vars),{nt:1,icon:type==='safety'?'shield':'bell',go:()=>{if(U())go('notifs')}});
}
const unread=()=>{const u=U();return u?u.notifs.filter(n=>!n.read).length:0};
function addTx(kind,amount,tk,vars){const u=U();u.txs.unshift({id:uid(),ts:Date.now(),kind,amount,tk,vars:vars||{}});if(u.txs.length>100)u.txs.length=100}
function firstName(){const u=U();return u?u.name.trim().split(/\s+/)[0]:''}
function greeting(){const h=new Date().getHours();return h<12?t('gm'):h<17?t('ga'):t('ge')}
function findUser(id){
  const s=String(id||'').trim().toLowerCase();
  if(okEmail(s))return Object.values(DB.users).find(u=>u.email&&u.email.toLowerCase()===s);
  if(okPhone(s)){const p=normPhone(s);return Object.values(DB.users).find(u=>normPhone(u.phone)===p)}
  return null;
}

I.otpd=(el)=>{
  const inputs=$$('#otp input'),i=+el.dataset.x;let v=el.value.replace(/\D/g,'');
  if(v.length>1){v.slice(0,6).split('').forEach((c,k)=>{if(inputs[k])inputs[k].value=c});const n=Math.min(v.length,5);inputs[n].focus();return}
  el.value=v;if(v&&i<5)inputs[i+1].focus();
  const e=$('#otp-e');if(e)e.hidden=true;
  if(inputs.every(x=>x.value))A.otpgo();
};
document.addEventListener('keydown',e=>{

    const inputs=$$('#otp input'),i=+e.target.dataset.x;

const PROMOS={
WELCOME50:{pct:50,cap:200,first:1,kinds:'all',d:['50% off your first ride (up to Rs 200)','پہلی رائیڈ پر 50% رعایت (200 روپے تک)']},
SAVE100:{flat:100,min:600,kinds:'all',d:['Rs 100 off orders over Rs 600','600 روپے سے زائد پر 100 روپے رعایت']},
SHARE20:{pct:20,cap:100,kinds:['shared'],d:['20% off shared seats (up to Rs 100)','شیئرڈ سیٹ پر 20% رعایت (100 روپے تک)']},
LUXE10:{pct:10,cap:3000,kinds:['luxury_car','luxury_bike'],d:['10% off luxury bookings (up to Rs 3,000)','لگژری بکنگ پر 10% رعایت (3,000 روپے تک)']},
};
function promoCheck(code,kind,sub,u){
  const p=PROMOS[code];if(!p)return{ok:false,err:'promo_bad'};
  if(u.promoUsed.includes(code))return{ok:false,err:'promo_used'};
  if(p.kinds!=='all'&&!p.kinds.includes(kind))return{ok:false,err:'promo_kind'};
  if(p.first&&u.trips.some(x=>x.status!=='cancelled'&&x.promo!==code))return{ok:false,err:'promo_first'};
  if(p.min&&sub<p.min)return{ok:false,err:'promo_min',v:{n:money(p.min)}};
  let amt=p.flat?p.flat:Math.min(p.cap,Math.round(sub*p.pct/100));amt=Math.min(amt,sub);
  return{ok:true,amt};
}

  const tr={id:uid(),kind:d.kind,status,from:d.from,to:d.to,veh:d.vehicle,km:+q.km.toFixed(1),min:q.min,fare:q.f,disc:q.disc,promo:q.disc?d.promo:null,total:q.total,pay:d.pay,luggage:{...d.luggage},note:d.note||'',ts:q.ts,created:Date.now(),phaseT:0,progress:0,code:'SSR'+(100000+Math.floor(Math.random()*899999)),rating:null,chat:[]};
  tr.pathB=roadPath(tr.from,tr.to,tr.id);tr.searchDur=3+Math.random()*2;return tr;
}
const isRental=tr=>tr.kind==='luxury_car'||tr.kind==='luxury_bike';
function beginSearch(tr){tr.status='searching';tr.phaseT=0;tr.progress=0;tr.searchDur=tr.searchDur||3.5;save();ensureEngine()}
A.bookGo=()=>{
  const d=S.draft,u=U();if(!d||!d.vehicle)return;
  if(d.when==='now'&&activeTrip()){toast(t('have_active'),{icon:'alert'});return}
  if(d.when==='later'){const ts=d.ts;if(!ts||ts<Date.now()+29*60000||ts>Date.now()+7*864e5+6e4){setErr('sched',t('err_when'));const e=$('#sched');if(e)e.focus();return}}
  const q=quote(d);
  if(d.pay==='wallet'&&u.wallet<q.total){toast(t('pay_low'),{icon:'alert'});return}
  const later=d.when==='later';
  const tr=makeTrip(d,q,later?'scheduled':'searching');
  u.dueFee=0;u.trips.unshift(tr);addRecent(d.to);S.draft=null;
  if(later){notify('ride','n_book_t','n_book_b',{w:whenLabel(tr.ts),a:tr.from},{n:'detail',id:tr.id},true);save();reset('home');go('detail',{id:tr.id});toast(t('n_book_t'),{icon:'check'})}
  else{beginSearch(tr);reset('home');go('trip',{id:tr.id})}
};
A.dispatchNow=d=>{const tr=U().trips.find(x=>x.id===d.id);if(!tr)return;if(activeTrip()){toast(t('have_active'),{icon:'alert'});return}tr.ts=Date.now();beginSearch(tr);go('trip',{id:tr.id})};

/* ================= ENGINE ================= */
const inSea=p=>(p.x<8.4&&p.y>19.5)||p.y>27.4+(p.x-13)*.18;
function assignDriver(tr){
  if(!tr.drv){
    let c=DRV.filter(d=>d.cat===tr.veh&&(tr.kind!=='women'||d.g==='f'));
    if(!c.length&&tr.kind==='women')c=DRV.filter(d=>d.g==='f');
    const list=c.length?c:DRV;tr.drv={...list[hash(tr.id)%list.length]};
  }
  tr.pin=String(1000+Math.floor(Math.random()*9000));
  const eta=((tr.kind==='normal'||tr.kind==='luggage'||tr.kind==='women'||tr.kind==='van'))?VEH[tr.veh].eta+hash(tr.id)%3:6;tr.etaMin=eta;
  const r=Math.max(1.4,eta*.5);let st=null;
  for(let i=0;i<10&&!st;i++){const a=((hash(tr.id+'a')%360)+i*36)*Math.PI/180;const c={x:clamp(tr.from.x+Math.cos(a)*r,1,33),y:clamp(tr.from.y+Math.sin(a)*r,1,26)};if(!inSea(c))st=c}
  st=st||{x:tr.from.x+r,y:tr.from.y-r};
  tr.pathA=roadPath(st,tr.from,tr.id+'A');tr.arriveDur=10+eta*1.5;tr.ongoingDur=clamp(tr.km*3+12,20,42);
  setStatus(tr,'arriving');
}
function setStatus(tr,st){
  tr.status=st;tr.phaseT=0;tr.progress=st==='arrived'?1:0;
  const u=U(),c=cur(),onTrip=c.n==='trip'&&c.p.id===tr.id,d=tr.drv;
  if(st==='arriving')notify('ride','n_drv_t','n_drv_b',{d:{en:d.en,ur:d.ur},v:d.car,p:tr.pin},{n:'trip',id:tr.id},onTrip);
  if(st==='arrived')notify('ride','n_arr_t','n_arr_b',{d:{en:d.en,ur:d.ur},a:tr.from},{n:'trip',id:tr.id},onTrip);
  if(st==='ongoing'){toast(t('pin_ok'),{icon:'check'});if((u.prefs.autoShare||tr.kind==='women')&&u.contacts.length)setTimeout(()=>toast(t('auto_shared',{n:u.contacts.length}),{icon:'share'}),1200)}
  save();if(onTrip||c.n==='home')render();
}
function settle(tr){
  const u=U();const amt=tr.total;
  if(tr.pay==='wallet'){const w=Math.min(u.wallet,amt);u.wallet-=w;addTx('out',w,'tx_ride');if(w<amt)tr.cashDue=amt-w}
  else if(tr.pay!=='cash')addTx('info',amt,'tx_ride_card');
  if(tr.promo&&!u.promoUsed.includes(tr.promo))u.promoUsed.push(tr.promo);
}
function finishTrip(tr){
  tr.status='completed';tr.progress=1;tr.doneAt=Date.now();
  if(!tr.prepaid)settle(tr);
  addRecent(tr.to);
  const c=cur(),onTrip=c.n==='trip'&&c.p.id===tr.id;
  notify('ride','n_done_t','n_done_b',{a:money(tr.total)},{n:'rate',id:tr.id},onTrip);
  save();
  if(onTrip){S.rate=null;S.stack.pop();go('rate',{id:tr.id})}else if(c.n==='home')render();
}
function tripTick(){
  const u=U();if(!u){return}
  const now=Date.now(),dt=Math.min(1,(now-(S.lastTick||now))/1000);S.lastTick=now;
  for(const s of u.trips){if(s.status==='scheduled'&&((s.kind==='normal'||s.kind==='luggage'||s.kind==='women'))&&s.ts<=now&&!activeTrip()){beginSearch(s);notify('ride','n_sched_t','n_sched_b',{},{n:'trip',id:s.id});const c=cur();if(c.n==='home'||c.n==='activity'||(c.n==='detail'&&c.p.id===s.id))render()}}
  const tr=activeTrip();if(!tr)return;
  tr.phaseT=(tr.phaseT||0)+dt;
  if(tr.status==='searching'){if(tr.phaseT>=(tr.searchDur||3.5))assignDriver(tr)}
  else if(tr.status==='arriving'){tr.progress=clamp(tr.phaseT/tr.arriveDur,0,1);if(tr.progress>=1)setStatus(tr,'arrived')}
  else if(tr.status==='arrived'){if(tr.phaseT>=6)setStatus(tr,'ongoing')}
  else if(tr.status==='ongoing'){
    tr.progress=clamp(tr.phaseT/tr.ongoingDur,0,1);
    if(!tr.chk&&tr.progress>.5&&u.prefs.safety!==false){tr.chk='show';const c=cur();if(c.n==='trip'&&c.p.id===tr.id)render()}
    if(tr.progress>=1)finishTrip(tr);
  }
  if(activeTrip()===tr)paintTrip(tr);
  if(now-(S.lastSave||0)>1500){S.lastSave=now;save()}
}
function ensureEngine(){if(!S.timers.eng)S.timers.eng=setInterval(tripTick,250)}
function subPath(path,f){
  const tot=polyLen(path);const pts=[{x:path[0].x,y:path[0].y}];let d=clamp(f,0,1)*tot;
  for(let i=1;i<path.length;i++){const s=dist(path[i-1],path[i]);if(d>=s){pts.push({x:path[i].x,y:path[i].y});d-=s}else{const u=s?d/s:0;pts.push({x:path[i-1].x+(path[i].x-path[i-1].x)*u,y:path[i-1].y+(path[i].y-path[i-1].y)*u});break}}
  return pts;
}
function tripGeom(tr){
  if(tr.status==='arriving'||tr.status==='arrived')return{path:tr.pathA,f:tr.status==='arrived'?1:tr.progress};
  if(tr.status==='ongoing')return{path:tr.pathB,f:tr.progress};
  return null;
}
function tripEta(tr){
  if(tr.status==='arriving')return Math.max(1,Math.ceil(tr.etaMin*(1-tr.progress)));
  if(tr.status==='ongoing')return Math.max(1,Math.ceil(tr.min*(1-tr.progress)));
  return 0;
}
function paintTrip(tr){
  const c=cur();if(c.n!=='trip'||c.p.id!==tr.id)return;
  const g=tripGeom(tr);
  if(g&&g.path){const p=pointAt(g.path,g.f);const car=$('#carg');if(car)car.setAttribute('transform',`translate(${p.x} ${p.y})`);const r=$('#cargr');if(r)r.setAttribute('transform',`rotate(${p.a+90})`);
    if(tr.status==='ongoing'){const dl=$('#doneline');if(dl)dl.setAttribute('points',subPath(g.path,g.f).map(q=>q.x+','+q.y).join(' '))}}
  const e=$('#eta');if(e)e.textContent=etaText(tr);
  const s=$('#etasub');if(s)s.textContent=etaSub(tr);
  const pr=$('#tprog i');if(pr)pr.style.width=(tr.progress*100)+'%';
}
function etaText(tr){
  if(tr.status==='arriving')return t('t_arr',{n:LANG==='ur'?tr.drv.ur:tr.drv.en,m:durTxt(tripEta(tr))});
  if(tr.status==='arrived')return t('t_here');
  if(tr.status==='ongoing')return isRental(tr)?t('t_rent'):t('t_on',{d:pn(tr.to)});
  return t('t_finding');
}
function etaSub(tr){
  if(tr.status==='ongoing'){const m=tripEta(tr);return isRental(tr)?t('t_rent_left',{m:durTxt(tr.min*(1-tr.progress)||1)}):t('t_left',{km:t('km',{n:(tr.km*(1-tr.progress)).toFixed(1)}),m:durTxt(m)})}
  if(tr.status==='arrived')return t('t_here_s');
  return '';
}
/* ================= TRIP SCREEN ================= */
function tripMapHTML(tr){
  const ongo=tr.status==='ongoing',pre=tr.status==='arriving'||tr.status==='arrived';
  const route=pre?tr.pathA:tr.pathB;let marks=[];let pts=route.slice();
  if(pre){marks.push({kind:'from',x:tr.from.x,y:tr.from.y})}
  else{marks.push({kind:'from',x:tr.from.x,y:tr.from.y});if(!isRental(tr))marks.push({kind:'to',x:tr.to.x,y:tr.to.y})}
  if(tr.status==='searching'){[[1.4,-1],[-1.6,.9],[.8,1.7]].forEach(o=>marks.push({kind:'minicar',x:tr.from.x+o[0],y:tr.from.y+o[1]}));pts=[{x:tr.from.x-2.5,y:tr.from.y-2},{x:tr.from.x+2.5,y:tr.from.y+2},...route]}
  const g=tripGeom(tr);let done=null;
  if(g){const p=pointAt(g.path,g.f);marks.push({kind:'car',x:p.x,y:p.y,a:p.a});if(ongo)done=subPath(g.path,g.f)}
  return mapBox({pts,route:tr.status==='searching'?route:route,done,marks,aspect:1.5,cw:400,pad:.32,minW:6},'','height:100%');
}

   <div class="scroll" style="flex:none;max-height:64%;padding-top:16px;background:var(--surface);border-radius:26px 26px 0 0;margin-top:-22px;position:relative;box-shadow:0 -10px 30px rgba(45,20,70,.14)">${panel}</div></div>`};

/* ---------- cancel ---------- */
function cancelTrip(tr,reason){
  const u=U();let fee=0;
  if(tr.status==='arrived'&&((tr.kind==='normal'||tr.kind==='luggage'||tr.kind==='women'||tr.kind==='van')))fee=100;
  tr.status='cancelled';tr.cancelReason=reason;tr.fee=fee;tr.cancelledAt=Date.now();
  if(fee){if(u.wallet>=fee){u.wallet-=fee;addTx('out',fee,'tx_fee')}else u.dueFee=(u.dueFee||0)+fee}
  if(tr.prepaid&&tr.total>0&&tr.pay!=='cash'){u.wallet+=tr.total;addTx('in',tr.total,'tx_refund');tr.refunded=true}
  save();
  notify('ride','n_cxl_t','n_cxl_b',{d:isRental(tr)?{en:tr.item.en,ur:tr.item.ur||tr.item.en}:tr.to},null,true);
}

SC.profile=()=>{
  const u=U();
  const item=(icon,label,to,sub,extra)=>`<button class="lrow" data-a="nav" data-to="${to}"><span class="ic plain">${ic(icon,'sm')}</span><div class="grow"><div class="b ell">${esc(label)}</div>${sub?`<div class="tiny muted ell">${esc(sub)}</div>`:''}</div>${extra||''}${ic('chev','chev sm flip')}</button>`;
  return{tab:'profile',html:`<div class="scr">${head(t('prof_h'),{noBack:true})}<div class="scroll">
   <div class="card"><div class="row"><span class="avatar lg" ${u.avatar?`style="background-image:url(${u.avatar})"`:''}>${u.avatar?'':esc(initials(u.name))}</span><div class="grow"><div class="h2 ell">${esc(u.name)}</div><div class="small muted ell ltr" style="text-align:start">${esc(fmtPhone(u.phone))}</div>${u.email?`<div class="small muted ell ltr" style="text-align:start">${esc(u.email)}</div>`:''}<div class="tiny muted mt4">${esc(t('member_since',{y:new Date(u.created).getFullYear()}))}</div></div></div></div>
   <div class="cats mt16" style="grid-template-columns:repeat(3,1fr);gap:8px">
     <div class="card flat" style="text-align:center;padding:12px 6px"><div class="b" style="font-size:19px">${u.trips.filter(x=>x.status==='completed').length}</div><div class="tiny muted">${esc(t('act_h'))}</div></div>
     <div class="card flat" style="text-align:center;padding:12px 6px"><div class="b" style="font-size:19px">${money(u.wallet).replace(/\s/,'\n')}</div><div class="tiny muted">${esc(t('bal_l'))}</div></div>
     <div class="card flat" style="text-align:center;padding:12px 6px"><div class="b" style="font-size:19px">${u.contacts.length}</div><div class="tiny muted">${esc(t('ec_h'))}</div></div></div>
   <div class="sec"><h2>${esc(t('settings_l'))}</h2></div>
   <div class="group">${item('edit','','edit-profile',null,'').replace('<div class="b ell"></div>',`<div class="b ell">${esc(t('edit_profile'))}</div>`)}
     ${item('pin','','places',null,'').replace('<div class="b ell"></div>',`<div class="b ell">${esc(t('my_places'))}</div>`)}
     ${item('wallet','','wallet',null,'').replace('<div class="b ell"></div>',`<div class="b ell">${esc(t('payments_l'))}</div>`)}
     ${item('shield','','safety',null,'').replace('<div class="b ell"></div>',`<div class="b ell">${esc(t('safety_l'))}</div>`)}
     ${item('gear','','settings',null,'').replace('<div class="b ell"></div>',`<div class="b ell">${esc(t('settings_l'))}</div>`)}
     ${item('help','','help',null,'').replace('<div class="b ell"></div>',`<div class="b ell">${esc(t('help_l'))}</div>`)}</div>
   <button class="btn line mt16" data-a="logout" style="color:var(--bad);border-color:var(--bad-bg)">${ic('logout','sm')}${esc(t('logout_l'))}</button>
  </div></div>`};
};
A.logout=()=>confirmDlg({icon:'logout',title:t('logout_q'),ok:t('logout_l'),cancel:t('cancel'),onOk:()=>{DB.session=null;save();S.stack=[{n:'welcome',p:{}}];S.tab='home';render()}});
/* ---------- edit profile ---------- */
SC['edit-profile']=()=>{
  const u=U();
  return{html:`<div class="scr">${head(t('ep_h'))}<div class="scroll">
   <div class="center col" style="align-items:center;gap:10px"><span class="avatar lg" ${u.avatar?`style="background-image:url(${u.avatar})"`:''}>${u.avatar?'':esc(initials(u.name))}</span>
   <div class="row" style="gap:16px"><label class="link" style="cursor:pointer">${esc(t('change_photo'))}<input type="file" accept="image/*" id="avfile" style="display:none"></label>${u.avatar?`<button class="link" data-a="rmAvatar" style="color:var(--bad)">${esc(t('remove_photo'))}</button>`:''}</div></div>
   <form data-f="editprof" novalidate class="col mt16" style="gap:14px">
    ${fld('ename',t('full_name'),{val:u.name,icon:'user',max:60})}
    ${fld('eemail',t('email'),{val:u.email,icon:'mail',im:'email',dir:'ltr'})}
    <div class="fld"><label>${esc(t('gender_l'))}</label><div class="chips">${[['female','g_female'],['male','g_male'],['other','g_other'],['','g_skip']].map(([v,l])=>`<button type="button" class="chip ${u.gender===v?'on':''}" data-a="setGender" data-v="${v}">${esc(t(l))}</button>`).join('')}</div></div>
    <button class="btn" type="submit">${esc(t('save'))}</button>
   </form>
   <div class="div"></div>
   <div class="group"><button class="lrow" data-a="nav" data-to="change-mobile"><span class="ic plain">${ic('phone','sm')}</span><div class="grow b">${esc(t('change_mobile'))}</div>${ic('chev','chev sm flip')}</button></div>
  </div></div>`,mount:()=>{const f=$('#avfile');if(f)f.addEventListener('change',onAvatar)}};
};
function onAvatar(e){
  const file=e.target.files[0];if(!file)return;
  if(file.size>3*1024*1024){toast(t('err_photo_big'),{icon:'alert'});return}
  const r=new FileReader();r.onload=()=>{U().avatar=r.result;save();render()};r.readAsDataURL(file);
}
L({err_photo_big:['Photo is too large (max 3MB)','تصویر بہت بڑی ہے (زیادہ سے زیادہ 3MB)']});
A.rmAvatar=()=>{U().avatar=null;save();render()};
A.setGender=d=>{U().gender=d.v;save();render()};
F.editprof=()=>{
  const u=U(),name=val('ename'),mail=val('eemail');setErr('ename','');setErr('eemail','');let ok=true;
  if(!okName(name)){setErr('ename',t('err_name'));ok=false}
  if(mail&&!okEmail(mail)){setErr('eemail',t('err_email'));ok=false}
  else if(mail&&mail.toLowerCase()!==u.email.toLowerCase()){const ex=findUser(mail);if(ex&&ex.id!==u.id){setErr('eemail',t('err_email_used'));ok=false}}
  if(!ok)return;u.name=name.trim();u.email=mail;save();back();toast(t('profile_saved'),{icon:'check'});
};
SC['change-mobile']=()=>{const u=U();return{html:`<div class="scr">${head(t('cm_h'))}<div class="scroll"><form data-f="chmobile" novalidate class="col gap14">
  <div class="fld"><label>${esc(t('cm_cur'))}</label><div class="inp"><span class="pre ltr">${esc(fmtPhone(u.phone))}</span></div></div>
  ${fld('nphone',t('cm_new'),{ph:'03XX XXXXXXX',icon:'phone',im:'tel',dir:'ltr',max:16})}
  <button class="btn" type="submit">${esc(t('send_code'))}</button></form></div></div>`}};
F.chmobile=()=>{
  const u=U(),p=val('nphone');setErr('nphone','');
  if(!okPhone(p)){setErr('nphone',t('err_phone'));return}
  if(normPhone(p)===normPhone(u.phone)){setErr('nphone',t('err_same_phone'));return}
  if(findUser(p)){setErr('nphone',t('err_phone_used'));return}
  sendOtp('phone',normPhone(p),{phone:normPhone(p)});go('otp');
};
/* ---------- places ---------- */
SC.places=()=>{
  const u=U();
  const row=(w,label,icon)=>`<button class="lrow" data-a="editSaved" data-w="${w}"><span class="ic">${ic(icon,'sm')}</span><div class="grow"><div class="b">${esc(label)}</div><div class="small muted ell">${u.places[w]?esc(pn(u.places[w])):t('set_dest')}</div></div>${ic('chev','chev sm flip')}</button>`;
  const favs=u.places.fav||[];
  return{html:`<div class="scr">${head(t('places_h'))}<div class="scroll"><div class="group">${row('home',t('home_l'),'home')}${row('work',t('work_l'),'flag')}</div>
   <div class="sec"><h2>${esc(t('fav_places'))}</h2><button class="link" data-a="addFav">${esc(t('add'))}</button></div>
   ${favs.length?`<div class="group">${favs.map((f,i)=>`<div class="lrow"><span class="ic">${ic('heart','sm')}</span><div class="grow"><div class="b ell">${esc(f.name)}</div><div class="tiny muted ell">${esc(pn(f.place))}</div></div><button class="iconbtn" style="width:36px;height:36px;border-radius:11px;color:var(--bad)" data-a="rmFav" data-i="${i}" aria-label="${esc(t('remove'))}">${ic('trash','sm')}</button></div>`).join('')}</div>`:emptyState('heart',t('no_fav'))}</div></div>`};
};
A.editSaved=d=>{S.pickCb=p=>{U().places[d.w]=p;save()};go('pick',{field:'to'})};
A.addFav=()=>{S.pickCb=p=>{S.favPending=p;showSheet(favNameSheet)};go('pick',{field:'to'})};
function favNameSheet(){
  return{title:t('fav_name'),body:fld('favname','',{ph:t('fav_name_ph'),icon:'heart',max:24}).replace('<label for="favname"></label>',''),foot:`<button class="btn" data-a="favSave">${esc(t('save'))}</button>`};
}
A.favSave=()=>{
  const n=val('favname').trim();setErr('favname','');if(!n){setErr('favname',t('required'));return}
  const u=U();u.places.fav=u.places.fav||[];u.places.fav.push({name:n,place:S.favPending});save();S.favPending=null;closeSheet();render();toast(t('place_added'),{icon:'check'});
};
A.rmFav=d=>confirmDlg({icon:'trash',danger:1,title:t('remove_place_q'),ok:t('remove'),onOk:()=>{U().places.fav.splice(+d.i,1);save();render();toast(t('place_removed'),{icon:'check'})}});

SC.notifs=()=>{
  const u=U();

  return{html:`<div class="scr">${head(t('notifs_h'),{right:u.notifs.some(n=>!n.read)?`<button class="link small" data-a="markRead">${esc(t('mark_read'))}</button>`:''})}<div class="scroll">${u.notifs.length?rows:emptyState('bell',t('no_notifs'),t('no_notifs_s'))}</div></div>`};

A.openNotif=d=>{const u=U(),n=u.notifs.find(x=>x.id===d.id);if(!n)return;n.read=true;save();
  if(n.link){const tr=n.link.id?u.trips.find(x=>x.id===n.link.id):null;
    if(n.link.n==='trip'&&tr&&ACTIVE.includes(tr.status))go('trip',{id:tr.id});
    else if(n.link.n==='rate'&&tr)go('rate',{id:tr.id});
    else if(tr)go('detail',{id:tr.id});
    else go(n.link.n);
  }else render();
};

A.ecSave=()=>{
  const u=U(),n=val('ecname'),p=val('ecphone');let ok=true;setErr('ecname','');setErr('ecphone','');
  if(!okName(n)){setErr('ecname',t('err_name'));ok=false}
  if(!okPhone(p)){setErr('ecphone',t('err_phone'));ok=false}
  else if(u.contacts.some(c=>normPhone(c.phone)===normPhone(p))){setErr('ecphone',t('err_dup_contact'));ok=false}
  if(!ok)return;
  u.contacts.push({name:n.trim(),phone:fmtPhone(p)});save();closeSheet();render();toast(t('contact_added'),{icon:'check'});
};
A.rmContact=d=>confirmDlg({icon:'trash',danger:1,title:t('remove_contact_q'),ok:t('remove'),onOk:()=>{U().contacts.splice(+d.i,1);save();render();toast(t('contact_removed'),{icon:'check'})}});

L({

const CITIES=['Karachi','Lahore','Islamabad','Hyderabad','Multan','Faisalabad','Peshawar','Quetta','Sukkur','Rawalpindi'];
const CITY_DIST={};
(function(){
  const coord={Karachi:[24.86,67.01],Lahore:[31.55,74.34],Islamabad:[33.68,73.05],Hyderabad:[25.4,68.37],Multan:[30.2,71.47],Faisalabad:[31.42,73.09],Peshawar:[34.0,71.54],Quetta:[30.18,66.99],Sukkur:[27.7,68.86],Rawalpindi:[33.6,73.07]};
  CITIES.forEach(a=>CITIES.forEach(b=>{if(a===b)return;const[a1,a2]=coord[a],[b1,b2]=coord[b];const d=Math.hypot(a1-b1,a2-b2)*111;CITY_DIST[a+'|'+b]=Math.round(d)}));
})();

  const b=S.icb,u=U();
  const cd=DRV.filter(x=>x.cat==='comfort')[hash(b.from+b.to+b.date)%DRV.filter(x=>x.cat==='comfort').length];
  if(b.pay==='wallet'&&u.wallet<b.price){toast(t('pay_low'),{icon:'alert'});return}
  const tr={id:uid(),kind:'intercity',status:'confirmed',cityFrom:b.from,cityTo:b.to,icDist:b.km,icHrs:b.hrs,veh:b.veh.k,seats:b.seats,ts:new Date(b.date+'T09:00').getTime(),total:b.price,pay:b.pay,fare:{base:b.price,dist:0,minTop:0,surgeAmt:0,surgeX:1,luggage:0,fee:0,due:0,total:b.price,sub:b.price},disc:0,

function icDurTxt(tr){const left=Math.max(0,tr.icHrs*3600-((tr.icPhase||0)));const h=Math.floor(left/3600),m=Math.floor((left%3600)/60);return durTxt(h*60+m)}
A.icStart=d=>{
  const u=U(),tr=u.trips.find(x=>x.id===d.id);if(!tr)return;
  tr.status='ongoing';tr.icPhase=0;tr.icRealDur=clamp(tr.icHrs*4,16,40);save();render();
  clearInterval(S.timers['ic'+tr.id]);
  S.timers['ic'+tr.id]=setInterval(()=>{
    const t2=U()&&U().trips.find(x=>x.id===tr.id);if(!t2||t2.status!=='ongoing'){clearInterval(S.timers['ic'+tr.id]);return}
    t2.icPhase=(t2.icPhase||0)+1;const frac=t2.icPhase/t2.icRealDur;
    if(frac>=1){t2.status='completed';t2.doneAt=Date.now();clearInterval(S.timers['ic'+tr.id]);save();
      notify('ride','n_done_t','n_done_b',{a:money(t2.total)},{n:'rate',id:t2.id},cur().n==='detail'&&cur().p.id===t2.id);

};
