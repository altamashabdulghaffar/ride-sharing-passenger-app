<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B133FF">
<title>Smart Safe Ride</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --brand:#9B30FF; --brand2:#6D28D9; --brand-ink:#fff; --brand-text:#7E22E0; --brand-deep:#5B17A6;
  --grad:linear-gradient(135deg,#A43BFF 0%,#7C2AE8 55%,#5B21B6 100%);
  --tint:#F3E8FF; --tint2:#E4CCFF;
  --bg:#F6F4FA; --surface:#FFFFFF; --surface2:#F1EDF7; --surface3:#E9E4F1; --ink:#15101E; --ink2:#3A3348; --muted:#6E6680; --line:#E8E3F0; --line2:#DCD5E6;
  --gold:#A5761A; --gold-bg:#FFF3D6; --ok:#0B9A68; --ok-bg:#E1F6EC; --bad:#E0344B; --bad-bg:#FDE8EC; --warn:#B26A00; --warn-bg:#FFF1D9; --info:#2563EB; --info-bg:#E5EDFF;
  --land:#F1EEE8; --sea:#A9D2F0; --sea2:#93C3E8; --park:#CFEAC6; --road:#FFFFFF; --road2:#D8D1DC; --hwy:#FFE59A; --hwy2:#E8C667; --block:#E3DED6; --maptext:#6A6374; --street:#FFFFFF;
  --sh1:0 1px 2px rgba(22,12,40,.05),0 2px 10px rgba(22,12,40,.05);
  --sh2:0 2px 6px rgba(22,12,40,.05),0 12px 32px rgba(22,12,40,.10);
  --sh3:0 24px 60px rgba(22,12,40,.22);
  --shadow:var(--sh1);
  --r-sm:12px; --r:16px; --r-lg:22px; --r-xl:28px;
  --font:'Outfit','Noto Sans Arabic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --lh:1.45; color-scheme:light;
  --maxw:640px; --railw:0px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand-text:#C88BFF; --brand-deep:#E2C6FF; --tint:#2A1B40; --tint2:#3A2757;
    --bg:#0E0B14; --surface:#18131F; --surface2:#211A2B; --surface3:#2B2337; --ink:#F4EFFA; --ink2:#D6CEE2; --muted:#A198B2; --line:#2E2639; --line2:#3A3147;
    --gold:#E7B75D; --gold-bg:#35290F; --ok:#39CE8E; --ok-bg:#0F2C1F; --bad:#FF6B7C; --bad-bg:#3A1519; --warn:#F2B44C; --warn-bg:#382709; --info:#7AA7FF; --info-bg:#15223F;
    --land:#1A1621; --sea:#0F2437; --sea2:#0C1D2E; --park:#18291E; --road:#2D2638; --road2:#3A3247; --hwy:#4A3D1A; --hwy2:#5E4E22; --block:#231E2B; --maptext:#9C93AC; --street:#27212F;
    --sh1:0 1px 2px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.35); --sh2:0 12px 32px rgba(0,0,0,.45); --sh3:0 24px 60px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand-text:#C88BFF; --brand-deep:#E2C6FF; --tint:#2A1B40; --tint2:#3A2757;
  --bg:#0E0B14; --surface:#18131F; --surface2:#211A2B; --surface3:#2B2337; --ink:#F4EFFA; --ink2:#D6CEE2; --muted:#A198B2; --line:#2E2639; --line2:#3A3147;
  --gold:#E7B75D; --gold-bg:#35290F; --ok:#39CE8E; --ok-bg:#0F2C1F; --bad:#FF6B7C; --bad-bg:#3A1519; --warn:#F2B44C; --warn-bg:#382709; --info:#7AA7FF; --info-bg:#15223F;
  --land:#1A1621; --sea:#0F2437; --sea2:#0C1D2E; --park:#18291E; --road:#2D2638; --road2:#3A3247; --hwy:#4A3D1A; --hwy2:#5E4E22; --block:#231E2B; --maptext:#9C93AC; --street:#27212F;
  --sh1:0 1px 2px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.35); --sh2:0 12px 32px rgba(0,0,0,.45); --sh3:0 24px 60px rgba(0,0,0,.6); color-scheme:dark;
}
html[lang="ur"]{--font:'Noto Sans Arabic','Outfit',system-ui,sans-serif;--lh:1.75}
html{height:100%;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:var(--lh);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:default}
h1,h2,h3,h4,p{margin:0}
a{color:var(--brand-text)}
img,video{max-width:100%;display:block}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 60%,transparent);outline-offset:2px;border-radius:10px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
::selection{background:var(--tint2)}

/* ============ shell ============ */
#stage{height:100%;padding-top:env(safe-area-inset-top,0px)}
#side{display:none}
#app{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
#screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scr.in-fwd{animation:scrF .32s var(--ease)} .scr.in-back{animation:scrB .32s var(--ease)} .scr.in-tab{animation:fadeUp .26s var(--ease)}
@keyframes scrF{from{opacity:0;transform:translateX(18px)}} @keyframes scrB{from{opacity:0;transform:translateX(-18px)}}
[dir=rtl] .scr.in-fwd{animation-name:scrB} [dir=rtl] .scr.in-back{animation-name:scrF}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
.pad{padding-inline:max(18px,calc((100% - var(--maxw))/2))}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:2px max(18px,calc((100% - var(--maxw))/2)) 28px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:12px max(14px,calc((100% - var(--maxw))/2 - 4px)) 10px}
.top h1{font-size:19px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.top.glass{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.foot{flex:none;padding:12px max(18px,calc((100% - var(--maxw))/2)) calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px}
.iconbtn{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);position:relative;transition:transform .15s,background .15s,border-color .15s;color:var(--ink)}
.iconbtn:hover{border-color:var(--line2)} .iconbtn:active{transform:scale(.94)}
.iconbtn.sm{width:34px;height:34px;border-radius:11px} .iconbtn.ghost{background:transparent;border-color:transparent}
.iconbtn.brand{background:var(--brand);border-color:var(--brand);color:#fff} .iconbtn.danger{color:var(--bad)}
.iconbtn .dot{position:absolute;top:-5px;inset-inline-end:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1;border:2px solid var(--bg)}
[dir=rtl] .flip{transform:scaleX(-1)}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:18px;height:18px} svg.i.xs{width:14px;height:14px} svg.i.lg{width:28px;height:28px} svg.i.xl{width:40px;height:40px}

/* ============ type & util ============ */
.h1{font-size:28px;font-weight:700;line-height:1.18;letter-spacing:-.02em}
.h2{font-size:20px;font-weight:650;line-height:1.3;letter-spacing:-.01em}
.h3{font-size:16px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12px} .xs{font-size:11px}
.b{font-weight:600} .bb{font-weight:700} .center{text-align:center}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wrap{overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:10px}.row>*,.col>*{min-width:0}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}.gap4{gap:4px}.gap6{gap:6px}.gap8{gap:8px}.gap14{gap:14px}.gap18{gap:18px}
.wrapr{flex-wrap:wrap}.between{justify-content:space-between}.start{align-items:flex-start}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 10px}
.sec h2{font-size:17px;font-weight:650;letter-spacing:-.01em}
.link{color:var(--brand-text);font-weight:600;font-size:14px;padding:4px 2px;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* ============ buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 18px;border-radius:16px;font-weight:650;font-size:16px;line-height:1.25;text-align:center;background:var(--grad);color:var(--brand-ink);width:100%;border:1px solid transparent;transition:transform .14s,opacity .14s,box-shadow .2s,filter .2s;letter-spacing:.005em;box-shadow:0 8px 20px -8px color-mix(in srgb,var(--brand) 70%,transparent);position:relative;overflow:hidden}
.btn:hover{filter:brightness(1.05)} .btn:active{transform:scale(.982)}
.btn[disabled],.btn.off{opacity:.42;pointer-events:none;box-shadow:none}
.btn.sec2{background:var(--tint);color:var(--brand-text);box-shadow:none}
.btn.line{background:var(--surface);color:var(--ink);border-color:var(--line2);box-shadow:none}
.btn.bad{background:var(--bad-bg);color:var(--bad);box-shadow:none}
.btn.solidbad{background:linear-gradient(135deg,#F0435A,#C81E3A);color:#fff;box-shadow:0 8px 20px -8px rgba(224,52,75,.7)}
.btn.ok{background:linear-gradient(135deg,#12B27A,#0A8A5C);color:#fff;box-shadow:0 8px 20px -8px rgba(11,154,104,.6)}
.btn.dark{background:var(--ink);color:var(--bg);box-shadow:none}
.btn.white{background:#fff;color:#4C1D95;box-shadow:none}
.btn.sm{min-height:40px;padding:6px 14px;font-size:14px;border-radius:12px;width:auto}
.btn.xs{min-height:32px;padding:4px 11px;font-size:13px;border-radius:10px;width:auto;gap:5px}
.btn.ghost{background:transparent;color:var(--brand-text);box-shadow:none}
.btn .spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.btn.line .spin,.btn.sec2 .spin{border-color:var(--line2);border-top-color:var(--brand)}
@keyframes spin{to{transform:rotate(360deg)}}
.btnrow{display:flex;gap:10px}.btnrow>.btn{flex:1}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:16px;background:var(--tint);color:var(--brand-text);font-size:12.5px;font-weight:600;min-height:64px;justify-content:center;transition:transform .14s}
.qa button:active{transform:scale(.96)} .qa button.bad{background:var(--bad);color:#fff} .qa button.plain{background:var(--surface2);color:var(--ink)}

/* ============ form ============ */
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.inp{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:15px;transition:border-color .15s,box-shadow .15s}
.inp:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 16%,transparent)}
.inp.err{border-color:var(--bad)}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;width:100%;border:0;background:transparent;outline:0;padding:12px 0;font-size:16px;text-overflow:ellipsis}
.inp textarea{resize:none;min-height:70px;line-height:1.45}
.inp svg{color:var(--muted)}
.inp .pre{color:var(--muted);font-weight:600;flex:none;direction:ltr;unicode-bidi:isolate}
.inp .eye{color:var(--muted);padding:6px;margin-inline-end:-6px}
.ferr{color:var(--bad);font-size:12.5px;font-weight:500;margin-top:-2px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:15px;font-size:13.5px;line-height:1.5}
.banner.err{background:var(--bad-bg);color:var(--bad)} .banner.ok{background:var(--ok-bg);color:var(--ok)} .banner.info{background:var(--tint);color:var(--brand-text)} .banner.warn{background:var(--warn-bg);color:var(--warn)} .banner.blue{background:var(--info-bg);color:var(--info)}
.banner svg{margin-top:1px}
.dtrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ============ cards & lists ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px;box-shadow:var(--sh1)}
.card.flat{box-shadow:none}
.card.tap{width:100%;text-align:start;display:block;transition:transform .14s,box-shadow .2s,border-color .2s}
.card.tap:hover{border-color:var(--line2);box-shadow:var(--sh2)} .card.tap:active{transform:scale(.99)}
.card.hl{border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:start}
.lrow+.lrow{border-top:1px solid var(--line)}
button.lrow:hover .grow>.b{color:var(--brand-text)}
.lrow .ic,.ic{width:40px;height:40px;border-radius:13px;background:var(--tint);color:var(--brand-text);display:grid;place-items:center;flex:none}
.ic.gold{background:var(--gold-bg);color:var(--gold)} .ic.ok{background:var(--ok-bg);color:var(--ok)} .ic.bad{background:var(--bad-bg);color:var(--bad)} .ic.plain{background:var(--surface2);color:var(--ink)} .ic.blue{background:var(--info-bg);color:var(--info)} .ic.warn{background:var(--warn-bg);color:var(--warn)}
.ic.sm{width:32px;height:32px;border-radius:10px} .ic.lg{width:52px;height:52px;border-radius:16px}
.lrow .chev{color:var(--muted);flex:none}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:0 14px;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:13.5px;font-weight:550;white-space:nowrap;max-width:100%;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--line2)}
.chip.on{background:var(--tint);border-color:var(--brand);color:var(--brand-text)}
.chip.off{opacity:.45;pointer-events:none}
.chip .cnt{background:var(--surface2);color:var(--muted);border-radius:999px;padding:0 7px;font-size:11.5px;font-weight:700;line-height:18px}
.chip.on .cnt{background:var(--brand);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.hs{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 6px;margin:0 -18px;scrollbar-width:none;scroll-behavior:smooth}
.hs::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:650;background:var(--tint);color:var(--brand-text);white-space:nowrap;line-height:1.5}
.badge svg.i{width:13px;height:13px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.gold{background:var(--gold-bg);color:var(--gold)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.gray{background:var(--surface2);color:var(--muted)}.badge.blue{background:var(--info-bg);color:var(--info)}.badge.solid{background:var(--brand);color:#fff}.badge.dark{background:var(--ink);color:var(--bg)}
.badge .bdot{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.live .bdot{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;padding:6px 10px;border-radius:11px;font-weight:600;font-size:14px;text-align:center;color:var(--muted);line-height:1.2;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s}
.seg button.on{background:var(--surface);color:var(--brand-text);box-shadow:0 1px 4px rgba(22,12,40,.12)}
.seg button[disabled]{opacity:.4}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{padding:11px 14px;font-weight:600;font-size:14.5px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{color:var(--brand-text);border-color:var(--brand)}
.sw{position:relative;width:50px;height:30px;border-radius:15px;background:var(--line2);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:inset-inline-start .2s var(--ease)}
.sw.on{background:var(--brand)} .sw.on::after{inset-inline-start:23px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none}
.radio.on{border-color:var(--brand)} .radio.on::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--brand)}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--tint2);color:var(--brand-deep);font-weight:700;font-size:17px;flex:none;overflow:hidden;background-size:cover;background-position:center;position:relative}
.avatar.lg{width:84px;height:84px;font-size:30px}.avatar.sm{width:36px;height:36px;font-size:14px}.avatar.xs{width:28px;height:28px;font-size:11.5px}
.avatar .on{position:absolute;bottom:1px;inset-inline-end:1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.stars{display:inline-flex;gap:2px;color:#F5A524}.stars svg{width:16px;height:16px;fill:currentColor;stroke:none}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface2);border-radius:13px;padding:3px}
.stepper button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface);color:var(--brand-text);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.stepper button[disabled]{opacity:.35}
.stepper span{min-width:34px;text-align:center;font-weight:650;font-variant-numeric:tabular-nums}
.div{height:1px;background:var(--line);margin:12px 0}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:5px 0;font-size:14.5px}
.kv span:first-child{color:var(--muted)} .kv span:last-child{font-weight:600;text-align:end;min-width:0;overflow-wrap:anywhere}
.kv.tot{font-size:17px;padding-top:10px;border-top:1px dashed var(--line2);margin-top:6px}.kv.tot span:first-child{color:var(--ink);font-weight:650}
.kv.disc span:last-child{color:var(--ok)} .kv.up span:last-child{color:var(--warn)}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.stat b{display:block;font-size:19px;line-height:1.3}

/* skeleton / empty */
.sk{background:linear-gradient(90deg,var(--surface2) 25%,var(--surface3) 50%,var(--surface2) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:16px}
@keyframes sh{to{background-position:-200% 0}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 20px}
.empty .eic{width:80px;height:80px;border-radius:28px;background:var(--tint);color:var(--brand-text);display:grid;place-items:center;position:relative}
.empty .eic::after{content:"";position:absolute;inset:-8px;border-radius:34px;border:1.5px dashed var(--tint2)}

/* ============ nav ============ */
#nav{flex:none;display:flex;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));position:relative;z-index:5}
#nav:empty{display:none}
#nav .rbrand,#nav .rsos,#nav .rsp{display:none}
#nav button.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);font-size:11px;font-weight:600;border-radius:14px;line-height:1.2;text-align:center;position:relative;transition:color .15s}
#nav button.ni .nic{width:46px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
#nav button.ni.on{color:var(--brand-text)}
#nav button.ni.on .nic{background:var(--tint)}
#nav button.ni span.l{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nav .ndot{position:absolute;top:2px;inset-inline-end:calc(50% - 22px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface)}
#app.notab #nav{display:none}

/* ============ sheets / dialogs ============ */
#layer{position:absolute;inset:0;z-index:40;pointer-events:none}
.bd{position:absolute;inset:0;background:rgba(14,8,24,.52);pointer-events:auto;animation:fade .2s;backdrop-filter:blur(2px)}
.sheet{position:absolute;inset-inline:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:28px 28px 0 0;pointer-events:auto;animation:up .3s var(--ease);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--sh3)}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line2);margin:9px auto 4px;flex:none}
.sheet .sh{flex:none;display:flex;align-items:center;gap:10px;padding:8px 18px 8px}
.sheet .sh h2{flex:1;min-width:0;font-size:19px;font-weight:650}
.sheet .sb{flex:1;min-height:0;overflow-y:auto;padding:6px 18px 18px;overscroll-behavior:contain}
.sheet .sf{flex:none;padding:12px 18px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.dlg{position:absolute;inset:0;display:grid;place-items:center;padding:22px;pointer-events:none}
.dlg .box{width:100%;max-width:360px;background:var(--surface);border-radius:28px;padding:24px 20px 18px;pointer-events:auto;animation:pop .26s var(--ease);display:flex;flex-direction:column;gap:12px;text-align:center;max-height:90%;overflow:auto;box-shadow:var(--sh3)}
.dlg .box.wide{max-width:420px;text-align:start}
@keyframes up{from{transform:translateY(60px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.92);opacity:0}}
#toasts{position:absolute;top:calc(70px + env(safe-area-inset-top,0px));inset-inline:12px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--bg);padding:12px 15px;border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.28);font-size:14px;font-weight:500;animation:drop .34s var(--ease);line-height:1.4;width:100%;max-width:440px}
.toast .grow{overflow-wrap:anywhere}
.toast.nt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.toast.nt .ti{color:var(--brand-text)}
.toast.bad{background:var(--bad);color:#fff}
@keyframes drop{from{transform:translateY(-18px);opacity:0}}

/* ============ map ============ */
.map{position:relative;width:100%;direction:ltr;overflow:hidden;background:var(--land);touch-action:none;user-select:none;-webkit-user-select:none}
.map.static{touch-action:auto}
.map>svg{display:block;width:100%;height:100%}
.map.grab{cursor:grab} .map.grabbing{cursor:grabbing}
.map .ov{position:absolute;inset:0;pointer-events:none}
.mapctl{position:absolute;inset-inline-end:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.mapctl button{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--sh2);color:var(--ink)}
.mapchip{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface);box-shadow:var(--sh2);font-size:12.5px;font-weight:650;border:1px solid var(--line)}
.pulse{animation:pl 2s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pl{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.routeflow{animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}

/* ============ home ============ */
.homehead{display:flex;align-items:center;gap:10px;padding:14px max(14px,calc((100% - var(--maxw))/2 - 4px)) 8px}
.sospill{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 14px;border-radius:14px;background:var(--bad);color:#fff;font-weight:700;font-size:13.5px;letter-spacing:.04em;box-shadow:0 8px 20px -8px rgba(224,52,75,.8);flex:none}
.sospill:active{transform:scale(.95)}
.slider{position:relative;border-radius:var(--r-xl);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;box-shadow:var(--sh2);isolation:isolate}
.sl-track{display:flex;will-change:transform}
.sl-track.anim{transition:transform .62s cubic-bezier(.65,0,.25,1)}
.slide{flex:0 0 100%;min-width:0;position:relative;height:196px;color:#fff;overflow:hidden;display:flex;align-items:stretch}
.slide .sbg{position:absolute;inset:0;z-index:-1;transform:scale(1.06);transition:transform 5.5s linear}
.slide.cur .sbg{transform:scale(1)}
.slide .sbg i{position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.slide .stx{position:relative;z-index:1;padding:20px 20px 18px;display:flex;flex-direction:column;justify-content:center;gap:6px;max-width:62%}
.slide .skick{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85;display:inline-flex;gap:6px;align-items:center}
.slide .stt{font-size:22px;font-weight:700;line-height:1.15;letter-spacing:-.015em}
.slide .sst{font-size:13px;opacity:.9;line-height:1.4}
.slide .scta{margin-top:6px;align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:#fff;color:#2B1452;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.slide .sart{position:absolute;inset-inline-end:-6px;bottom:6px;width:52%;max-width:260px;height:124px;z-index:0;filter:drop-shadow(0 14px 18px rgba(0,0,0,.28))}
[dir=rtl] .slide .sart{transform:scaleX(-1)}
.slide .stx>*{opacity:0;transform:translateY(12px)}
.slide.cur .stx>*{animation:slIn .6s var(--ease) forwards}
.slide.cur .stx>*:nth-child(2){animation-delay:.08s}.slide.cur .stx>*:nth-child(3){animation-delay:.16s}.slide.cur .stx>*:nth-child(4){animation-delay:.24s}
.slide .sart svg{opacity:0;transform:translateX(40px) scale(.94);transition:opacity .6s .15s,transform .8s .15s var(--ease)}
.slide.cur .sart svg{opacity:1;transform:none}
@keyframes slIn{to{opacity:1;transform:none}}
.sl-nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.22);backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;z-index:3;opacity:0;transition:opacity .2s,background .2s}
.slider:hover .sl-nav,.sl-nav:focus-visible{opacity:1} .sl-nav:hover{background:rgba(255,255,255,.35)}
.sl-prev{inset-inline-start:10px}.sl-next{inset-inline-end:10px}
.sl-dots{position:absolute;top:16px;inset-inline-end:18px;display:flex;gap:6px;z-index:3}
.sl-dots button{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.45);transition:width .35s var(--ease),background .3s;position:relative;overflow:hidden;padding:0}
.sl-dots button.on{width:28px;background:rgba(255,255,255,.35)}
.sl-dots button.on::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(0);animation:slProg var(--sldur,5s) linear forwards}
[dir=rtl] .sl-dots button.on::after{transform-origin:right}
.slider.paused .sl-dots button.on::after{animation-play-state:paused}
@keyframes slProg{to{transform:scaleX(1)}}
.where{display:flex;align-items:center;gap:12px;min-height:58px;padding:0 8px 0 16px;background:var(--surface);border-radius:18px;box-shadow:var(--sh2);width:100%;text-align:start;border:1px solid var(--line);transition:box-shadow .2s,transform .14s}
.where:hover{box-shadow:var(--sh3)} .where:active{transform:scale(.99)}
.where .ph{flex:1;min-width:0;font-weight:650;font-size:17px}
.where .nowb{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:12px;padding:8px 11px;font-size:13px;font-weight:600;flex:none}
.mapcard{position:relative;border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--line);box-shadow:var(--sh1);height:170px}
.mapcard .map{height:100%}
.svc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;position:relative;border-radius:18px;padding:4px 2px;transition:transform .14s}
.tile:active{transform:scale(.95)}
.tile .ti{width:60px;height:60px;border-radius:20px;display:grid;place-items:center;background:var(--tint);color:var(--brand-text);position:relative;transition:transform .2s var(--ease),box-shadow .2s}
.tile:hover .ti{transform:translateY(-2px);box-shadow:var(--sh2)}
.tile .ti svg.i{width:28px;height:28px}
.tile .tl{font-size:12.5px;font-weight:600;line-height:1.25;color:var(--ink2);max-width:84px;overflow-wrap:anywhere}
.tile .tbadge{position:absolute;top:-6px;inset-inline-end:-8px;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:8px;background:var(--ink);color:var(--bg);letter-spacing:.03em;white-space:nowrap}
.tile.c1 .ti{background:linear-gradient(135deg,#A43BFF,#6D28D9);color:#fff;box-shadow:0 8px 18px -8px rgba(124,42,232,.8)}
.tile.c2 .ti{background:#E5F5EE;color:#0B8A5C}.tile.c3 .ti{background:#FDE7F1;color:#C8246E}.tile.c4 .ti{background:#FFF3D6;color:#A5761A}.tile.c5 .ti{background:#E5EDFF;color:#2563EB}.tile.c6 .ti{background:#FFEBDD;color:#C2540C}.tile.c7 .ti{background:#E7F7FB;color:#0E7490}.tile.c8 .ti{background:#FDE8EC;color:#E0344B}.tile.c9 .ti{background:#EEEAF6;color:#4C3F66}
:root[data-theme="dark"] .tile:not(.c1) .ti{background:var(--surface2)!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile:not(.c1) .ti{background:var(--surface2)!important}}
.tile.lock .ti{filter:saturate(.4);opacity:.75}
.livecard{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r-lg);background:var(--grad);color:#fff;width:100%;text-align:start;box-shadow:0 14px 30px -12px rgba(124,42,232,.7);position:relative;overflow:hidden}
.livecard::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);inset-inline-end:-60px;top:-80px}
.livecard .ui{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.upc{display:flex;gap:12px;align-items:center;padding:14px;border-radius:var(--r-lg);background:var(--grad);color:#fff;width:100%;text-align:start}
.upc .ui{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.cdown{font-variant-numeric:tabular-nums;font-weight:700}
.emstrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.emstrip a,.emstrip button{display:flex;align-items:center;gap:8px;padding:10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);text-align:start}
.emstrip .n{font-weight:800;font-size:16px;line-height:1.1}
.emstrip .l{font-size:11.5px;color:var(--muted);font-weight:600}
.rt{display:flex;flex-direction:column;align-items:stretch;gap:0;position:relative}
.rt .rw{display:flex;gap:12px;align-items:center;min-height:38px;position:relative}
.rt .rw+.rw::before{content:"";position:absolute;inset-inline-start:7px;top:-14px;height:28px;border-inline-start:2px dotted var(--line2)}
.rt .dt{width:16px;height:16px;border-radius:50%;border:4px solid var(--ok);background:var(--surface);flex:none}
.rt .sq{width:16px;height:16px;border-radius:5px;background:var(--ink);flex:none;transform:scale(.8)}
.rt .sn{width:16px;height:16px;border-radius:50%;background:var(--brand);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;flex:none}
.rt.sm .rw{min-height:28px}.rt.sm .rw+.rw::before{top:-10px;height:20px}

/* planner */
.plan-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh1);padding:6px 10px}
.pstop{display:flex;align-items:center;gap:10px;padding:8px 2px;position:relative;border-radius:14px;transition:background .15s}
.pstop+.pstop::before{content:"";position:absolute;inset-inline-start:11px;top:-14px;height:26px;border-inline-start:2px dotted var(--line2)}
.pstop.drag{background:var(--tint);box-shadow:var(--sh2);z-index:2}
.pstop .mk{width:24px;height:24px;flex:none;display:grid;place-items:center}
.pstop .mk .dt{width:16px;height:16px;border-radius:50%;border:4px solid var(--ok);background:var(--surface)}
.pstop .mk .sq{width:14px;height:14px;border-radius:4px;background:var(--ink)}
.pstop .mk .sn{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.pstop .pbody{flex:1;min-width:0;text-align:start;padding:4px 0}
.pstop .pact{display:flex;gap:2px;flex:none}
.pstop .pname{display:block;width:100%;text-align:start}
.pstop .pact button{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.pstop .pact button:hover{background:var(--surface2);color:var(--ink)}
.pstop .pact button[disabled]{opacity:.25;pointer-events:none}
.pstop .handle{cursor:grab;touch-action:none}
.stoptype{display:inline-flex;gap:0;background:var(--surface2);border-radius:8px;padding:2px;margin-top:3px}
.stoptype button{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;color:var(--muted)}
.stoptype button.on{background:var(--surface);color:var(--brand-text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.estbar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--tint);color:var(--brand-text)}
.estbar b{font-size:20px;color:var(--ink)}
.flash{animation:flash .6s var(--ease)}
@keyframes flash{0%{transform:scale(1.08);color:var(--brand-text)}100%{transform:none}}

/* vehicle rows */
.veh{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);width:100%;text-align:start;position:relative;transition:border-color .15s,background .15s,box-shadow .2s}
.veh:hover{border-color:var(--line2)}
.veh.on{border-color:var(--brand);background:color-mix(in srgb,var(--tint) 70%,var(--surface));box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 14%,transparent)}
.veh.dis{opacity:.5;pointer-events:none}
.veh .vi{width:70px;height:46px;flex:none;display:grid;place-items:center}
.veh .vp{font-weight:700;font-size:16px;white-space:nowrap;text-align:end}
.veh .vp small{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
.veh+.veh{margin-top:8px}
.capbar{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:5px;max-width:160px}
.capbar i{display:block;height:100%;border-radius:3px;background:var(--ok)}
.capbar.warn i{background:var(--warn)} .capbar.bad i{background:var(--bad)}
.fareadj{border:1.5px dashed var(--tint2);background:color-mix(in srgb,var(--tint) 45%,var(--surface));border-radius:20px;padding:14px}
.fareadj .fv{font-size:26px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:120px;text-align:center}
.fareadj .fbtn{width:46px;height:46px;border-radius:15px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--brand-text);box-shadow:var(--sh1)}
.fareadj .fbtn[disabled]{opacity:.35}
.rate-star{width:44px;height:44px;color:var(--line2)}
.rate-star.on{color:#F5A524}
.rate-star svg{width:100%;height:100%;fill:currentColor;stroke:none}
.otp{display:flex;gap:8px;justify-content:center;direction:ltr}
.otp input{width:46px;height:58px;text-align:center;font-size:24px;font-weight:700;border:1.5px solid var(--line);border-radius:15px;background:var(--surface);outline:0;padding:0}
.otp input:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.pin{display:flex;gap:6px;direction:ltr}
.pin b{width:38px;height:46px;border-radius:12px;background:var(--surface);border:1.5px solid var(--brand);color:var(--brand-text);display:grid;place-items:center;font-size:22px}
.prog{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--grad);border-radius:3px;transition:width .3s linear}
.prog.ok i{background:var(--ok)} .prog.warn i{background:var(--warn)} .prog.bad i{background:var(--bad)}
.bubble{max-width:82%;padding:9px 13px;border-radius:18px;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--brand);color:#fff;border-end-end-radius:6px}
.bubble.dr{align-self:flex-start;background:var(--surface2);border-end-start-radius:6px}
.radar{position:relative;width:160px;height:160px;margin:6px auto;display:grid;place-items:center}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--brand);animation:pl 2s ease-out infinite;opacity:0}
.radar i:nth-child(2){animation-delay:.66s}.radar i:nth-child(3){animation-delay:1.33s}
.radar .core{width:70px;height:70px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;position:relative;box-shadow:0 8px 24px rgba(155,48,255,.5)}
.logo{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:16px;background:var(--grad);color:#fff;box-shadow:0 8px 22px -6px rgba(124,42,232,.6)}
.logo svg{width:28px;height:28px}
.faq summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 0;font-weight:600}
.faq summary::-webkit-details-marker{display:none}
.faq details+details{border-top:1px solid var(--line)}
.faq details[open] summary svg{transform:rotate(90deg)}
.faq p{padding:0 0 14px;color:var(--muted);font-size:14px;line-height:1.6}

/* ============ bookings ============ */
.bklist{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.bk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh1);overflow:hidden;transition:box-shadow .2s,border-color .2s}
.bk:hover{box-shadow:var(--sh2);border-color:var(--line2)}
.bk .bkm{display:block;width:100%;text-align:start;padding:14px 14px 12px}
.bk .bkh{display:flex;align-items:center;gap:10px}
.bk .bkw{display:flex;align-items:baseline;gap:8px;margin-top:10px;flex-wrap:wrap}
.bk .bkw b{font-size:17px}
.bk .bkd{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface2);border-top:1px solid var(--line)}
.bk .bka{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.bk.st-progress{border-color:color-mix(in srgb,var(--brand) 50%,var(--line))}
.bk.st-cancelled .bkm{opacity:.75}
.tl{display:flex;align-items:flex-start;gap:0;margin:4px 0 2px}
.tl .ts{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted)}
.tl .ts::before{content:"";position:absolute;top:11px;inset-inline-start:calc(-50% + 13px);width:calc(100% - 26px);height:2.5px;background:var(--line2);border-radius:2px}
.tl .ts:first-child::before{display:none}
.tl .ts i{width:24px;height:24px;border-radius:50%;background:var(--surface2);border:2px solid var(--line2);display:grid;place-items:center;color:#fff;position:relative;z-index:1}
.tl .ts.done{color:var(--ink)} .tl .ts.done i{background:var(--ok);border-color:var(--ok)} .tl .ts.done::before{background:var(--ok)}
.tl .ts.cur{color:var(--brand-text)} .tl .ts.cur i{background:var(--brand);border-color:var(--brand);box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 20%,transparent)} .tl .ts.cur::before{background:var(--ok)}
.tl .ts.bad i{background:var(--bad);border-color:var(--bad)} .tl .ts.bad{color:var(--bad)}

/* ============ share ============ */

/* ============ plans ============ */

.msg.cont{margin-top:-1px} .msg.cont .avatar{visibility:hidden}
.voice{display:flex;align-items:center;gap:10px;min-width:210px;padding:2px 0}
.voice .vplay{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.msg.me .voice .vplay{background:#fff;color:var(--brand)}
.voice .wave{flex:1;display:flex;align-items:center;gap:2px;height:30px}

.voice .wave i.p{opacity:1}
.voice .vd{font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.8;min-width:32px}
.ridemsg{min-width:230px}
.ridemsg .rmh{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:.8;margin-bottom:6px}
.ridemsg .rmb{background:color-mix(in srgb,currentColor 7%,transparent);border-radius:12px;padding:8px 10px}
.typing{display:inline-flex;gap:4px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;border-end-start-radius:6px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:tp 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:10px max(12px,calc((100% - var(--maxw))/2)) calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.composer .cin{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--surface2);border-radius:22px;padding:0 6px 0 14px;min-height:44px}
.composer textarea{flex:1;min-width:0;border:0;background:transparent;outline:0;resize:none;padding:11px 0;max-height:120px;font-size:15.5px;line-height:1.4}
.composer .cbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--muted)}
.composer .cbtn:hover{color:var(--ink)}
.composer .cbtn.send{background:var(--brand);color:#fff}
.composer .cbtn.rec{background:var(--bad);color:#fff}
.recbar{flex:1;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border-radius:22px;background:var(--bad-bg);color:var(--bad);font-weight:650}
.recbar .rdot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
.recbar .rwave{flex:1;display:flex;align-items:center;gap:2px;height:24px;overflow:hidden}
.recbar .rwave i{width:3px;border-radius:2px;background:var(--bad);flex:none}
.attach{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.attach button,.attach label{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer;text-align:center}
.attach .ai{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff}
.lightbox{position:absolute;inset:0;z-index:80;background:rgba(0,0,0,.92);display:grid;place-items:center;animation:fade .2s;padding:20px}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain}
.lightbox button{position:absolute;top:14px;inset-inline-end:14px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.memrow{display:flex;align-items:center;gap:12px;padding:10px 0}
.memrow+.memrow{border-top:1px solid var(--line)}
.rideoff{padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--sh1)}
.rideoff+.rideoff{margin-top:10px}

/* ============ auth ============ */
.authhero{position:relative;border-radius:30px;overflow:hidden;background:var(--grad);color:#fff;padding:26px 22px 22px;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end}
.authhero .ahart{position:absolute;inset-inline-end:-20px;top:18px;width:70%;max-width:300px;height:150px;filter:drop-shadow(0 18px 20px rgba(0,0,0,.3));animation:floaty 5s ease-in-out infinite}
[dir=rtl] .authhero .ahart{transform:scaleX(-1)}
@keyframes floaty{50%{translate:0 -8px}}

}

  #screen{grid-column:2;grid-row:1}

  .lightbox{padding:40px}
}

}

button.stat{cursor:pointer;display:block;width:100%;transition:border-color .15s}button.stat:hover{border-color:var(--line2)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

</div>
<script>
'use strict';
/* ================= CORE ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

}

/* ---------- storage ---------- */

/* ---------- icons ---------- */
const IC={

const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function nearestPlace(pt,maxKm=99){let best=null,bd=1e9;for(const k in PL){const d=dist(pt,PL[k]);if(d<bd){bd=d;best=PL[k]}}return bd<=maxKm?best:null}

function roadPath(a,b,seed=0){

const BLOCKS=(()=>{

      const h=hash(gx.toFixed(2)+':'+gy.toFixed(2)+':b');
      if(h%100<22)continue;
      // up to 2 buildings per block, kept inside the block so streets stay clear
      const n=1+(h%2);
      for(let q=0;q<n;q++){
        const hh=hash(h+':'+q);
        const w=.18+((hh%40)/40)*.28,ht=.18+((Math.floor(hh/41)%40)/40)*.28;
        const x=gx+.1+((hh%97)/97)*(G-.2-w),y=gy+.1+((Math.floor(hh/97)%97)/97)*(G-.2-ht);
        out.push({x:+x.toFixed(2),y:+y.toFixed(2),w:+w.toFixed(2),h:+ht.toFixed(2),alt:hh%3});
      }

})();

/* ================= USER / NOTIFICATIONS ================= */
function newUser(o){
  return{id:uid(),name:o.name,phone:o.phone,email:o.email||'',gender:o.gender,avatar:null,wallet:0,cards:[],mobiles:[],defPay:'cash',
    places:{home:null,work:null,fav:[]},contacts:[],trips:[],notifs:[],txs:[],tickets:[],
    prefs:{ride:true,offers:true,safety:true,autoShare:false},promos:['WELCOME50'],promoUsed:[],womenNotify:false,womenVerified:false,
    communities:[],monthlyPosts:[],
    ref:'SSR'+uid().slice(0,5).toUpperCase(),recents:[],dueFee:0,area:'gulshan',created:Date.now(),theme:null};
}
function notify(type,tk,bk,vars,link,quiet){
  const u=U();if(!u)return;
  u.notifs.unshift({id:uid(),ts:Date.now(),type,tk,bk,vars:vars||{},link:link||null,read:false});
  if(u.notifs.length>80)u.notifs.length=80;save();
  const pref={ride:'ride',offer:'offers',safety:'safety'}[type];
  if(!quiet&&(!pref||u.prefs[pref]!==false))toast(t(tk,vars),{nt:1,icon:type==='safety'?'shield':'bell',go:()=>{if(U())go('notifs')}});
}
const unread=()=>{const u=U();return u?u.notifs.filter(n=>!n.read).length:0};
function addTx(kind,amount,tk,vars){const u=U();u.txs.unshift({id:uid(),ts:Date.now(),kind,amount,tk,vars:vars||{}});if(u.txs.length>100)u.txs.length=100}
function firstName(){const u=U();return u?u.name.trim().split(/\s+/)[0]:''}
function greeting(){const h=new Date().getHours();return h<12?t('gm'):h<17?t('ga'):t('ge')}
function findUser(id){
  const s=String(id||'').trim().toLowerCase();
  if(okEmail(s))return Object.values(DB.users).find(u=>u.email&&u.email.toLowerCase()===s);
  if(okPhone(s)){const p=normPhone(s);return Object.values(DB.users).find(u=>normPhone(u.phone)===p)}
  return null;
}
const langSeg=()=>`<div class="seg" role="group" aria-label="${esc(t('language'))}" style="width:auto;min-width:150px"><button data-a="setlang" data-l="en" class="${LANG==='en'?'on':''}" lang="en" dir="ltr">English</button><button data-a="setlang" data-l="ur" class="${LANG==='ur'?'on':''}" lang="ur" dir="rtl">اردو</button></div>`;

/* ================= OTP ================= */
function sendOtp(purpose,phone,data){
  const code=String(Math.floor(100000+Math.random()*900000));
  S.otp={code,purpose,phone,data:data||{},exp:Date.now()+5*60000,resendAt:Date.now()+30000};
  toast(t('otp_sms',{c:code}),{icon:'msg',ms:6500});
}

  busy(b,false);sendOtp('login',normPhone(u.phone),{uid:u.id});go('otp');
};

F.signup=async()=>{
  const name=val('sname'),phone=val('sphone'),mail=val('smail'),ref=val('sref').toUpperCase(),gender=S.sgender;
  let ok=true;['sname','sphone','smail','sref'].forEach(i=>setErr(i,''));$('#sgender-e').hidden=true;
  if(!okName(name)){setErr('sname',t('err_name'));ok=false}
  if(!okPhone(phone)){setErr('sphone',t('err_phone'));ok=false}
  else if(findUser(phone)){setErr('sphone',t('err_phone_used'));ok=false}
  if(mail){if(!okEmail(mail)){setErr('smail',t('err_email'));ok=false}else if(findUser(mail)){setErr('smail',t('err_email_used'));ok=false}}
  if(!gender){$('#sgender-e').hidden=false;ok=false}
  if(ref&&ref!=='SAFE100'&&!Object.values(DB.users).some(u=>u.ref===ref)){setErr('sref',t('err_ref'));ok=false}
  if(!S.terms){const e=$('#terms-e');e.textContent=t('err_terms');e.hidden=false;ok=false}
  if(!ok){focusFirstErr();return}
  const b=$('#subtn');busy(b,true);await sleep(350);busy(b,false);
  sendOtp('signup',normPhone(phone),{name,phone:normPhone(phone),email:mail,ref,gender});
  go('otp');
};
SC.otp=()=>{
  const o=S.otp;if(!o)return SC.welcome();
  const left=Math.max(0,Math.ceil((o.resendAt-Date.now())/1000));
  return{html:`<div class="scr">${head('')}<div class="scroll"><div class="col gap18">
    <div><h1 class="h1">${esc(t('otp_h'))}</h1><p class="muted mt8">${esc(t('otp_p',{p:'\u2066'+fmtPhone(o.phone)+'\u2069'}))}</p></div>

    <div class="otp" id="otp">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="${i?'off':'one-time-code'}" aria-label="${i+1}" data-i="otpd" data-x="${i}">`).join('')}</div>
    <div class="ferr center" id="otp-e" hidden></div>
    <button class="btn" data-a="otpgo" id="otpbtn">${esc(t('verify'))}</button>
    <div class="center"><button class="link" data-a="otpre" id="otpre" ${left?'disabled style="opacity:.55"':''}>${left?esc(t('resend_in',{n:left})):esc(t('resend'))}</button></div>
  </div></div></div>`,mount:()=>{const f=$('#otp input');if(f)f.focus({preventScroll:true});startOtpTimer()}};
};
function startOtpTimer(){
  clearInterval(S.timers.otp);
  S.timers.otp=setInterval(()=>{
    const b=$('#otpre');if(!b||!S.otp){clearInterval(S.timers.otp);return}
    const left=Math.max(0,Math.ceil((S.otp.resendAt-Date.now())/1000));
    b.textContent=left?t('resend_in',{n:left}):t('resend');b.disabled=!!left;b.style.opacity=left?.55:1;
  },1000);
}
I.otpd=(el)=>{
  const inputs=$$('#otp input'),i=+el.dataset.x;let v=el.value.replace(/\D/g,'');
  if(v.length>1){v.slice(0,6).split('').forEach((c,k)=>{if(inputs[k])inputs[k].value=c});const n=Math.min(v.length,5);inputs[n].focus();return}
  el.value=v;if(v&&i<5)inputs[i+1].focus();
  const e=$('#otp-e');if(e)e.hidden=true;
  if(inputs.every(x=>x.value))A.otpgo();
};
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.dataset&&e.target.dataset.i==='otpd'){
    const inputs=$$('#otp input'),i=+e.target.dataset.x;
    if(e.key==='Backspace'&&!e.target.value&&i>0){inputs[i-1].focus();inputs[i-1].value=''}
    if(e.key==='Enter')A.otpgo();
  }
});
A.otpre=()=>{const o=S.otp;if(!o||Date.now()<o.resendAt)return;sendOtp(o.purpose,o.phone,o.data);render();toast(t('otp_sent'),{icon:'check'})};
A.otpgo=async()=>{
  const o=S.otp;if(!o)return;const code=$$('#otp input').map(i=>i.value).join('');const e=$('#otp-e');
  const show=m=>{e.textContent=m;e.hidden=false};
  if(code.length<6){show(t('err_otp_len'));return}
  if(Date.now()>o.exp){show(t('err_otp_exp'));return}
  if(code!==o.code){show(t('err_otp'));$$('#otp input').forEach(i=>i.value='');$('#otp input').focus();return}
  const b=$('#otpbtn');busy(b,true);await sleep(400);busy(b,false);
  clearInterval(S.timers.otp);
  const d=o.data,p=o.purpose;S.otp=null;
  if(p==='signup'){
    const u=newUser({name:d.name,phone:d.phone,email:d.email,gender:d.gender});DB.users[u.id]=u;DB.session=u.id;
    if(d.ref){u.wallet+=100;addTx('in',100,'tx_ref');}
    save();S.sgender=null;S.terms=false;
    notify('offer','n_welcome_t','n_welcome_b',{},{n:'wallet'},true);
    notify('offer','n_promo_t','n_promo_b',{},{n:'wallet'},true);
    notify('safety','n_safe_t','n_safe_b',{},{n:'contacts'},true);
    S.tab='home';reset('home');toast(t('welcome_toast',{n:firstName()}),{icon:'check'});
  }else if(p==='login'){
    DB.session=d.uid;save();S.tab='home';reset('home');toast(t('welcome_toast',{n:firstName()}),{icon:'check'});
  }else if(p==='phone'){const u=U();u.phone=d.phone;save();back();toast(t('phone_updated'),{icon:'check'})}
  else if(p==='women'){finishWomenVerify()}
};

function promoCheck(code,kind,sub,u){
  const p=PROMOS[code];if(!p)return{ok:false,err:'promo_bad'};
  if(u.promoUsed.includes(code))return{ok:false,err:'promo_used'};
  if(p.kinds!=='all'&&!p.kinds.includes(kind))return{ok:false,err:'promo_kind'};
  if(p.first&&u.trips.some(x=>x.status!=='cancelled'&&x.promo!==code))return{ok:false,err:'promo_first'};
  if(p.min&&sub<p.min)return{ok:false,err:'promo_min',v:{n:money(p.min)}};
  let amt=p.flat?p.flat:Math.min(p.cap,Math.round(sub*p.pct/100));amt=Math.min(amt,sub);
  return{ok:true,amt};
}

  const tot=polyLen(path);const pts=[{x:path[0].x,y:path[0].y}];let d=clamp(f,0,1)*tot;
  for(let i=1;i<path.length;i++){const s=dist(path[i-1],path[i]);if(d>=s){pts.push({x:path[i].x,y:path[i].y});d-=s}else{const u=s?d/s:0;pts.push({x:path[i-1].x+(path[i].x-path[i-1].x)*u,y:path[i-1].y+(path[i].y-path[i-1].y)*u});break}}
  return pts;
}
function tripGeom(tr){
  if(tr.status==='arriving'||tr.status==='arrived')return{path:tr.pathA,f:tr.status==='arrived'?1:tr.progress};
  if(tr.status==='ongoing')return{path:tr.pathB,f:tr.progress};
  return null;
}
function tripEta(tr){
  if(tr.status==='arriving')return Math.max(1,Math.ceil(tr.etaMin*(1-tr.progress)));
  if(tr.status==='ongoing')return Math.max(1,Math.ceil(tr.min*(1-tr.progress)));
  return 0;
}
function paintTrip(tr){
  const c=cur();if(c.n!=='trip'||c.p.id!==tr.id)return;
  const g=tripGeom(tr);
  if(g&&g.path){const p=pointAt(g.path,g.f);const car=$('#carg');if(car)car.setAttribute('transform',`translate(${p.x} ${p.y})`);const r=$('#cargr');if(r)r.setAttribute('transform',`rotate(${p.a+90})`);
    if(tr.status==='ongoing'){const dl=$('#doneline');if(dl)dl.setAttribute('points',subPath(g.path,g.f).map(q=>q.x+','+q.y).join(' '))}}
  const e=$('#eta');if(e)e.textContent=etaText(tr);
  const s=$('#etasub');if(s)s.textContent=etaSub(tr);
  const pr=$('#tprog i');if(pr)pr.style.width=(tr.progress*100)+'%';
}
function etaText(tr){

function etaSub(tr){
  if(tr.status==='ongoing'){const m=tripEta(tr);return isRental(tr)?t('t_rent_left',{m:durTxt(tr.min*(1-tr.progress)||1)}):t('t_left',{km:t('km',{n:(tr.km*(1-tr.progress)).toFixed(1)}),m:durTxt(m)})}

function stopIdx(r,pt){let bi=-1,bd=1e9;r.stops.forEach((s,i)=>{const d=dist(pt,PL[s]);if(d<bd){bd=d;bi=i}});return bd<=3?{i:bi,d:bd}:null}
function routeOffsetMin(r,i){let km=0;for(let k=1;k<=i;k++)km+=roadKm(PL[r.stops[k-1]],PL[r.stops[k]]);return Math.round(km*2.4)}
function seatFare(km){return Math.max(70,r5(25+17*km))}
function seatsLeft(r,dayTs){
  const u=U();const booked=u.trips.filter(x=>x.kind==='shared'&&x.routeId===r.id&&x.status!=='cancelled'&&sameDay(x.dayTs||x.ts,dayTs)).reduce((s,x)=>s+(x.seats||0),0);
  return Math.max(0,r.total-1-(hash(r.id+new Date(dayTs).toDateString())%3)-booked);
}
function sharedSearch(sh){
  const dayTs=dayStart(sh.day),dow=new Date(dayTs).getDay(),req=hm(sh.time),out=[];
  for(const r of SR){
    const a=stopIdx(r,sh.from),b=stopIdx(r,sh.to);
    if(!a||!b||b.i<=a.i)continue;
    if(!r.days.includes(dow))continue;
    const pmin=hm(r.dep)+routeOffsetMin(r,a.i),diff=Math.abs(pmin-req);
    if(diff>180)continue;
    const sA=PL[r.stops[a.i]],sB=PL[r.stops[b.i]],km=roadKm(sA,sB);
    out.push({r,a,b,sA,sB,km,pmin,diff,fare:seatFare(km),left:seatsLeft(r,dayTs),dayTs,walk:Math.round(a.d*1000),arrive:hm(r.dep)+routeOffsetMin(r,b.i)});
  }
  return out.sort((x,y)=>x.diff-y.diff);
}

function rentDurTxt(tr){const left=Math.max(0,tr.hrs*3600-(tr.rentPhase||0));const h=Math.floor(left/3600),m=Math.floor((left%3600)/60);return durTxt(h*60+m)}
A.rentStart=d=>{
  const u=U(),tr=u.trips.find(x=>x.id===d.id);if(!tr)return;
  tr.status='ongoing';tr.rentPhase=0;tr.rentRealDur=clamp(tr.hrs*3,16,40);save();render();
  clearInterval(S.timers['rent'+tr.id]);
  S.timers['rent'+tr.id]=setInterval(()=>{
    const t2=U()&&U().trips.find(x=>x.id===tr.id);if(!t2||t2.status!=='ongoing'){clearInterval(S.timers['rent'+tr.id]);return}
    t2.rentPhase=(t2.rentPhase||0)+1;const frac=t2.rentPhase/t2.rentRealDur;
    if(frac>=1){t2.status='completed';t2.doneAt=Date.now();clearInterval(S.timers['rent'+tr.id]);save();
      notify('ride','n_done_t','n_done_b',{a:money(t2.total)},{n:'rate',id:t2.id},cur().n==='detail'&&cur().p.id===t2.id);
      if(cur().n==='detail'&&cur().p.id===tr.id)go('rate',{id:tr.id});else render();
      return;
    }
    save();const el=$('#rentrem');if(el)el.textContent=t('rent_remaining',{t:rentDurTxt(t2)});
    const pr=$('#rentprog i');if(pr)pr.style.width=(frac*100)+'%';
  },1000);
};

    ${fld('ename',t('full_name'),{val:u.name,icon:'user',max:60})}

    <div class="fld"><label>${esc(t('gender_l'))}</label><div class="chips">${[['female','g_female'],['male','g_male']].map(([v,l])=>`<button type="button" class="chip ${u.gender===v?'on':''}" data-a="setGender" data-v="${v}">${esc(t(l))}</button>`).join('')}</div></div>

   <div class="div"></div>
   <div class="group"><button class="lrow" data-a="nav" data-to="change-mobile"><span class="ic plain">${ic('phone','sm')}</span><div class="grow b">${esc(t('change_mobile'))}</div>${ic('chev','chev sm flip')}</button></div>
  </div></div>`,mount:()=>{const f=$('#avfile');if(f)f.addEventListener('change',onAvatar)}};
};
function onAvatar(e){
  const file=e.target.files[0];if(!file)return;
  if(file.size>3*1024*1024){toast(t('err_photo_big'),{icon:'alert'});return}
  const r=new FileReader();r.onload=()=>{U().avatar=r.result;save();render()};r.readAsDataURL(file);
}
L({err_photo_big:['Photo is too large (max 3MB)','تصویر بہت بڑی ہے (زیادہ سے زیادہ 3MB)']});
A.rmAvatar=()=>{U().avatar=null;save();render()};
A.setGender=d=>{U().gender=d.v;save();render()};
F.editprof=()=>{
  const u=U(),name=val('ename'),mail=val('eemail');setErr('ename','');setErr('eemail','');let ok=true;
  if(!okName(name)){setErr('ename',t('err_name'));ok=false}
  if(mail&&!okEmail(mail)){setErr('eemail',t('err_email'));ok=false}
  else if(mail&&mail.toLowerCase()!==u.email.toLowerCase()){const ex=findUser(mail);if(ex&&ex.id!==u.id){setErr('eemail',t('err_email_used'));ok=false}}
  if(!ok)return;u.name=name.trim();u.email=mail;save();back();toast(t('profile_saved'),{icon:'check'});
};
SC['change-mobile']=()=>{const u=U();return{html:`<div class="scr">${head(t('cm_h'))}<div class="scroll"><form data-f="chmobile" novalidate class="col gap14">
  <div class="fld"><label>${esc(t('cm_cur'))}</label><div class="inp"><span class="pre ltr">${esc(fmtPhone(u.phone))}</span></div></div>
  ${fld('nphone',t('cm_new'),{ph:'03XX XXXXXXX',icon:'phone',im:'tel',dir:'ltr',max:16})}
  <button class="btn" type="submit">${esc(t('send_code'))}</button></form></div></div>`}};
F.chmobile=()=>{
  const u=U(),p=val('nphone');setErr('nphone','');
  if(!okPhone(p)){setErr('nphone',t('err_phone'));return}
  if(normPhone(p)===normPhone(u.phone)){setErr('nphone',t('err_same_phone'));return}
  if(findUser(p)){setErr('nphone',t('err_phone_used'));return}
  sendOtp('phone',normPhone(p),{phone:normPhone(p)});go('otp');
};

function fakeBidders(km,budget,seed){
  const pool=DRV.filter(d=>['comfort','go'].includes(d.cat));
  const n=2+hash(seed+km)%2;const out=[];
  for(let i=0;i<n;i++){const d=pool[(hash('b'+i+seed)+i)%pool.length];if(out.some(o=>o.drv.id===d.id))continue;const delta=[-1,0,1,2][hash('d'+i+seed)%4]*Math.round(budget*.06/10)*10;out.push({id:uid(),drv:{...d},price:Math.max(500,r5(budget+delta)),status:'pending'})}
  return out;
}

const MEDIA={dbp:null,urls:{},mem:{}};
function idb(){if(MEDIA.dbp)return MEDIA.dbp;MEDIA.dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('ssr_media',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});MEDIA.dbp.catch(()=>{});return MEDIA.dbp}
async function putMedia(id,blob){MEDIA.mem[id]=blob;try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction('m','readwrite');tx.objectStore('m').put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}
async function getMediaURL(id){if(!id)return null;if(MEDIA.urls[id])return MEDIA.urls[id];let b=MEDIA.mem[id]||null;if(!b){try{const db=await idb();b=await new Promise(res=>{const r=db.transaction('m').objectStore('m').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}catch(e){b=null}}if(!b)return null;return MEDIA.urls[id]=URL.createObjectURL(b)}
function hydrateMedia(root){if(!root)return;$$('[data-media]',root).forEach(el=>{if(el.dataset.h)return;el.dataset.h='1';getMediaURL(el.dataset.media).then(url=>{if(url)el.src=url;else{const d=document.createElement('div');d.className='small muted';d.style.cssText='padding:24px 16px;text-align:center';d.textContent=t('media_missing');el.replaceWith(d)}})})}

function icDurTxt(tr){const left=Math.max(0,tr.icHrs*3600-((tr.icPhase||0)));const h=Math.floor(left/3600),m=Math.floor((left%3600)/60);return durTxt(h*60+m)}
A.icStart=d=>{
  const u=U(),tr=u.trips.find(x=>x.id===d.id);if(!tr)return;
  tr.status='ongoing';tr.icPhase=0;tr.icRealDur=clamp(tr.icHrs*4,16,40);save();render();
  clearInterval(S.timers['ic'+tr.id]);
  S.timers['ic'+tr.id]=setInterval(()=>{
    const t2=U()&&U().trips.find(x=>x.id===tr.id);if(!t2||t2.status!=='ongoing'){clearInterval(S.timers['ic'+tr.id]);return}
    t2.icPhase=(t2.icPhase||0)+1;const frac=t2.icPhase/t2.icRealDur;
    if(frac>=1){t2.status='completed';t2.doneAt=Date.now();clearInterval(S.timers['ic'+tr.id]);save();
      notify('ride','n_done_t','n_done_b',{a:money(t2.total)},{n:'rate',id:t2.id},cur().n==='detail'&&cur().p.id===t2.id);
      if(cur().n==='detail'&&cur().p.id===tr.id)go('rate',{id:tr.id});else render();
      return;
    }
    save();const el=$('#icrem');if(el)el.textContent=t('ic_remaining',{t:icDurTxt(t2)});
    const pr=$('#icprog i');if(pr)pr.style.width=(frac*100)+'%';
  },1000);
};

/* ================= MIGRATION ================= */
function migrateUser(u){
  if(!Array.isArray(u.monthlyPosts))u.monthlyPosts=[];
  if(!Array.isArray(u.communities))u.communities=[];
  if(!Array.isArray(u.customNets))u.customNets=[];
  if(!Array.isArray(u.sosLog))u.sosLog=[];
  if(typeof u.womenVerified!=='boolean')u.womenVerified=false;
  if(typeof u.gender!=='string'||!['female','male'].includes(u.gender))u.gender=u.gender==='female'||u.gender==='male'?u.gender:'';
  if(!Array.isArray(u.notifs))u.notifs=[];
  if(!Array.isArray(u.txs))u.txs=[];
  if(!Array.isArray(u.tickets))u.tickets=[];
  if(!Array.isArray(u.trips))u.trips=[];
  if(!Array.isArray(u.recents))u.recents=[];
  if(!Array.isArray(u.contacts))u.contacts=[];
  if(!Array.isArray(u.cards))u.cards=[];
  if(!Array.isArray(u.mobiles))u.mobiles=[];
  if(!Array.isArray(u.promos))u.promos=['WELCOME50'];
  if(!Array.isArray(u.promoUsed))u.promoUsed=[];
  if(!u.places)u.places={home:null,work:null,fav:[]};
  if(!Array.isArray(u.places.fav))u.places.fav=[];
  if(!u.prefs)u.prefs={ride:true,offers:true,safety:true,autoShare:false};
  if(u.prefs.sound===undefined)u.prefs.sound=true;
  if(typeof u.wallet!=='number')u.wallet=0;
  if(typeof u.defPay!=='string')u.defPay='cash';
  if(!u.ref)u.ref='SSR'+uid().slice(0,5).toUpperCase();
  if(typeof u.dueFee!=='number')u.dueFee=0;
  if(!u.area)u.area='gulshan';
  u.trips.forEach(tr=>{
    if(!Array.isArray(tr.chat))tr.chat=[];
    if(tr.luggage===undefined)tr.luggage={s:0,m:0,l:0};
    if(tr.disc===undefined)tr.disc=0;
    if(!tr.remind)tr.remind=15;
    (tr.stops||[]).forEach(s=>{if(!s.type)s.type='drop'});
    if(tr.kind==='van'&&tr.van==='mini')tr.van='apv';
    if(tr.status==='scheduled'&&!tr.confirmAt&&tr.ts>Date.now())tr.confirmAt=Date.now()+3000;
    if(!tr.code)tr.code=newCode();
  });
}
